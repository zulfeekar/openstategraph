name: CI
on:
  push: { branches: [main] }
  # `pull_request`, never `pull_request_target`. That is the whole fork-safety
  # story: a pull request from a fork runs with a read-only GITHUB_TOKEN and no
  # access to repository secrets, and every job below is built to need neither.
  # `pull_request_target` would run trusted code with write permissions against
  # an untrusted diff — do not change this line to make a job "work".
  pull_request:

# Least privilege, stated rather than inherited: nothing in CI writes to the
# repository. The release train is where write permissions live, and it is a
# separate workflow that never runs on a pull request.
permissions:
  contents: read

# Cost control (docs/decisions/sdk-practice.md §3, recommendation 3): a push to
# an open pull request cancels the previous run instead of leaving it burning a
# runner. Keyed per ref, so main and each PR are independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Build before verify: seedDemo.test.ts's shipped-bundle guard inspects
      # dist/ and hard-fails without it — the guard is only real against a
      # built artifact, and CI is exactly where it must be real.
      - run: npm run build
      - run: npm run verify   # tsc + eslint + prettier-check + vitest

  # RC-01: `backend/openstategraph/compile/port_specs.json` is GENERATED from
  # the TypeScript node catalogue and committed (the Python wheel must work
  # with no Node.js installed). `npm run verify` already fails on drift via
  # `src/nodes/portSpecs.test.ts`, which compares the built artifact to the
  # committed bytes. This job proves the same thing the other way round —
  # regenerate, then diff the working tree — so a drift that somehow slipped
  # past the byte comparison (a generator that writes different bytes than it
  # builds) still cannot merge.
  generated-port-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:ports
      - name: The committed artifact must match the catalogue
        run: |
          # `--intent-to-add` so a *missing* artifact fails too: `git diff`
          # alone is blind to an untracked file, which is exactly the state a
          # deleted or never-committed artifact would be in.
          git add --intent-to-add backend/openstategraph/compile/port_specs.json
          if ! git diff --exit-code -- backend/openstategraph/compile/port_specs.json; then
            echo "::error::backend/openstategraph/compile/port_specs.json is stale."
            cat <<'MSG'

          The TypeScript node catalogue (src/nodes/**) is authoritative for node
          types and ports; the Python compiler and the MCP vocabulary read the
          generated JSON above. You changed a node type or a port without
          regenerating it.

            npm run generate:ports
            git add backend/openstategraph/compile/port_specs.json

          MSG
            exit 1
          fi

  # Scale-and-adopt ticket 05: `docs/openapi.json` is GENERATED from the FastAPI
  # app and committed, so an endpoint changing shape shows up as a reviewable
  # diff next to the code that changed it — and anyone can generate a client
  # (`npx openapi-typescript docs/openapi.json`) without booting us first.
  # `backend/tests/test_openapi_contract.py` already fails on drift by comparing
  # the committed bytes to a freshly built document. This job proves the same
  # thing the other way round — regenerate, then diff the working tree — so a
  # drift that somehow slipped past the byte comparison still cannot merge.
  # Exactly the shape of `generated-port-specs` above, deliberately.
  generated-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # `[all,dev]`, not `[all]`: the exact FastAPI pin that makes this
      # artifact reproducible lives in `[dev]`, because the document is a
      # build output and two FastAPI versions build two documents. Installing
      # `[all]` alone resolves whatever is newest and this job goes red with
      # no code change (ship-it ticket 50).
      - run: pip install -e "backend[all,dev]"
      - run: python3 scripts/generate_openapi.py
      - name: The committed contract must match the app
        run: |
          # `--intent-to-add` so a *missing* artifact fails too: `git diff`
          # alone is blind to an untracked file, which is exactly the state a
          # deleted or never-committed artifact would be in.
          git add --intent-to-add docs/openapi.json
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "::error::docs/openapi.json is stale."
            cat <<'MSG'

          The published API contract no longer matches the app. You changed an
          endpoint, a request model or a response model without regenerating it.

            python3 scripts/generate_openapi.py
            git add docs/openapi.json

          The prose half of the contract — the SSE event vocabulary, which
          OpenAPI cannot express — is docs/api.md. If you changed a stream,
          change that too.

          MSG
            exit 1
          fi

  # Tested on the versions we ADVERTISE — the floor and the ceiling of the
  # `Programming Language :: Python :: 3.x` classifiers in backend/pyproject.toml
  # (sdk-practice.md §3 recommendation 4, copying SUP's stated principle: lint
  # on one version, test on min and max).
  #
  # **The split, stated rather than implied.** Every leg runs the full pytest
  # suite, unconditionally and with the same coverage ratchet — a leg that
  # installs dependencies and asserts nothing is decoration, and
  # `test_every_matrix_leg_actually_runs_the_test_suite` fails if one ever
  # becomes that. Ruff and mypy run on the FLOOR leg only, and that is not an
  # arbitrary "one of them": `[tool.ruff] target-version` and `[tool.mypy]
  # python_version` are both `py311`, so both tools give an identical answer on
  # every leg by construction. The floor is also where a too-new syntax or a
  # too-new stdlib call actually fails, so the floor is where the static gates
  # belong.
  #
  # Middle versions are deliberately not run. Min and max bracket the language
  # changes; a break confined to 3.12 alone has no precedent in this codebase's
  # dependency set and is not worth a third runner on every pull request.
  #
  # `PYTHON_VERSIONS` below is asserted against the classifiers by
  # `backend/tests/test_python_support.py`, which parses THIS FILE. Widening the
  # classifiers without widening this matrix fails that test, and vice versa —
  # the claim and the proof cannot drift apart silently.
  backend:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide whether the other does.
      fail-fast: false
      matrix:
        # PYTHON_VERSIONS — the parity test reads this list.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      # `[all]` because a checkout exercises every surface — the HTTP API, the
      # MCP transport, deep agents, sqlite. A *consumer* installs the lean core
      # plus one provider extra; `backend/tests/test_distribution_metadata.py`
      # is what keeps that promise honest, since CI cannot see it from here.
      # No bare `ruff` here: the version is pinned in `backend[dev]`, so the
      # gate cannot drift with PyPI between two runs of the same commit.
      - run: pip install -e "backend[all,dev]"
      - if: matrix.python-version == '3.11'
        run: python -m ruff check backend
      # The type gate (ticket 05). Runs from `backend/` because `[tool.mypy]`
      # in backend/pyproject.toml is the config, and mypy reads the nearest
      # one. Ruff catches undefined names; this is what catches a wrong one.
      - if: matrix.python-version == '3.11'
        run: cd backend && python -m mypy
      # Coverage ratchet: backend sits at 91% (2026-08-09); fail-under
      # guards regressions, raised as it climbs. Live-API tests stay opt-in.
      # Deliberately unconditional — every leg of the matrix must actually run
      # the suite, and coverage is cheap next to the install above.
      - run: python -m pytest -q --cov=backend/openstategraph --cov-fail-under=85
  # The proof a green test suite cannot give (framework-packaging §3.6): build
  # the wheel, install it in an EMPTY venv outside the checkout, and drive it
  # with cwd outside the repo and PYTHONPATH empty. `pytest.ini` puts a
  # workflow's tools on sys.path in-tree, so `backend` passing says nothing
  # about what an adopter gets — and the defects this catches are silent ones
  # (a module not shipped, package data missing, a path computed from
  # `__file__` that resolves into site-packages once installed).
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Node is a build dependency of the WHEEL now, not just of the front end:
      # since scale-and-adopt ticket 01 the distribution carries the built
      # editor as package data, and `backend/hatch_build.py` fails the build
      # rather than shipping a visual workflow builder with no visuals. The
      # proof script runs `npm ci && npm run build` itself when `dist/` is
      # missing, which is always the case on a fresh runner.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: scripts/clean_install_proof.sh

  # Docs freshness: code changes should carry their documentation. Pure
  # git + bash, no dependencies. Escape hatch: `docs: not-needed` in any
  # commit message in the PR.
  docs-freshness:
    # Runs on a pull request **and** on a push to main. It was `pull_request`
    # only, and this repository pushes straight to main, so it had executed
    # once in its life -- a fact the `gallery-diagrams-check` comment below
    # already recorded and pointed at without anybody closing it. A gate that
    # skips on the only event this repository produces is not a gate.
    #
    # The range differs by event and nothing else: a pull request compares its
    # own base to its head; a push compares what main was to what it now is.
    # `github.event.before` is all zeroes on a branch's first push and can name
    # a commit a force-push made unreachable, so both are checked for and the
    # job says so rather than failing on a range it cannot read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Code changes must touch docs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="${PUSH_BEFORE:-}"; HEAD="$PUSH_AFTER"
            case "$BASE" in
              ''|0000000000000000000000000000000000000000)
                echo "First push on this ref — no range to compare."; exit 0 ;;
            esac
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              echo "The previous head is not in this clone (force-push?) — nothing to compare."
              exit 0
            fi
          fi
          echo "Comparing $BASE..$HEAD"
          changed=$(git diff --name-only "$BASE" "$HEAD")
          code=$(printf '%s\n' "$changed" | grep -E '^(src|backend)/' || true)
          if [ -z "$code" ]; then
            echo "No src/ or backend/ changes — nothing to check."; exit 0
          fi
          docs=$(printf '%s\n' "$changed" | grep -E '^(README\.md|docs/|openwiki/)' || true)
          if [ -n "$docs" ]; then
            echo "Docs updated alongside code:"; printf '%s\n' "$docs"; exit 0
          fi
          if git log --format='%B' "$BASE".."$HEAD" | grep -qF 'docs: not-needed'; then
            echo "Escape hatch found: a commit message says 'docs: not-needed'."; exit 0
          fi
          echo "::error::This PR changes src/ or backend/ but no documentation."
          cat <<'MSG'

          Code changed, docs did not.

          Please update one of:
            README.md      user-facing behaviour, setup, providers
            docs/          decisions and architecture notes
            openwiki/      generated reference (or let the workflow regenerate)

          If this change genuinely needs no docs, say so in a commit message:
            git commit --allow-empty -m "docs: not-needed — internal refactor only"

          MSG
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # workflow-gallery 57: `scripts/build_gallery_diagrams.py --check` and
  # `scripts/build_behind_the_scenes.py --check` both exist to fail when a
  # committed page (`site/gallery.html`, `site/behind-the-scenes.html`) has
  # drifted from what the compiler now produces, and until this job neither
  # ran anywhere — not here, not vitest, not pytest. That is how gallery 55
  # happened: the script was red on a clean checkout for as long as
  # `support-triage` carried its declared finding, and nobody was told because
  # nobody was asking.
  #
  # This runs on every push to main and every pull request, same as every
  # other job in this file. It used to say so by contrast with
  # `docs-freshness`, which was `if: pull_request` and had therefore fired
  # once in its life — an observation this comment recorded, pointed at, and
  # left standing. `docs-freshness` runs on a push now too, so the contrast is
  # gone and the rule is simply the file's rule: this repository pushes
  # straight to main, so a PR-only gate is a gate nobody has.
  #
  # Both scripts render Mermaid through `scripts/render_mermaid.mjs`, which
  # drives the vendored mermaid build inside Playwright chromium rather than
  # calling out to a CDN — so this job needs the same `npm ci` +
  # `playwright install --with-deps chromium` as `e2e` above, plus the backend
  # install the compiler itself needs. Rendering 27 diagrams is a different
  # cost and a different dependency from compiling 23 documents, which is why
  # this lives in its own CI job rather than inside `npm run verify` or
  # `pytest` (workflow-gallery 57's own reasoning, carried from ticket 55).
  # No node, no chromium, and that is the point rather than a saving.
  # `--check` used to re-render the diagrams and compare the SVG bytes, which
  # made this job a test of the runner's installed fonts: mermaid measures every
  # label in the browser, so the same graph renders to different coordinates on
  # a machine with Inter installed and one without. It went red on a commit
  # whose artefact had just been regenerated correctly (run 32659487566,
  # `workflow-gallery` 80). Both checks now compare the *graph* the picture
  # draws, through `scripts/diagram_gate.py`, and need only Python. Do not add a
  # renderer back to this job — a check that renders is a check that cannot pass
  # twice.
  gallery-diagrams-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "backend[all,dev]"
      - run: python3 scripts/build_gallery_diagrams.py --check
      - run: python3 scripts/build_behind_the_scenes.py --check

  # ONE status check to require in branch protection, instead of six that have
  # to be re-listed by hand every time a job is added, renamed or given a
  # matrix. Adding a job to `needs:` below is how it becomes mandatory.
  #
  # `if: always()` is load-bearing — without it this job is *skipped* when a
  # dependency fails, and a skipped required check is treated as neutral, which
  # would turn the gate into decoration. So it always runs and inspects the
  # results itself. `skipped` is accepted because `docs-freshness` legitimately
  # skips on push-to-main; `cancelled` is not.
  ci-success:
    if: always()
    needs: [frontend, generated-port-specs, generated-openapi, backend, clean-install, docs-freshness, e2e, gallery-diagrams-check]
    runs-on: ubuntu-latest
    steps:
      - name: Every check must have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required check reported '$result'."; exit 1 ;;
            esac
          done
          echo "All required checks passed."

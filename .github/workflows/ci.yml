name: CI
on:
  push: { branches: [main] }
  # `pull_request`, never `pull_request_target`. That is the whole fork-safety
  # story: a pull request from a fork runs with a read-only GITHUB_TOKEN and no
  # access to repository secrets, and every job below is built to need neither.
  # `pull_request_target` would run trusted code with write permissions against
  # an untrusted diff — do not change this line to make a job "work".
  pull_request:

# Least privilege, stated rather than inherited: nothing in CI writes to the
# repository. The release train is where write permissions live, and it is a
# separate workflow that never runs on a pull request.
permissions:
  contents: read

# Cost control (docs/decisions/sdk-practice.md §3, recommendation 3): a push to
# an open pull request cancels the previous run instead of leaving it burning a
# runner. Keyed per ref, so main and each PR are independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify   # tsc + eslint + prettier-check + vitest

  # RC-01: `backend/openstategraph/compile/port_specs.json` is GENERATED from
  # the TypeScript node catalogue and committed (the Python wheel must work
  # with no Node.js installed). `npm run verify` already fails on drift via
  # `src/nodes/portSpecs.test.ts`, which compares the built artifact to the
  # committed bytes. This job proves the same thing the other way round —
  # regenerate, then diff the working tree — so a drift that somehow slipped
  # past the byte comparison (a generator that writes different bytes than it
  # builds) still cannot merge.
  generated-port-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:ports
      - name: The committed artifact must match the catalogue
        run: |
          # `--intent-to-add` so a *missing* artifact fails too: `git diff`
          # alone is blind to an untracked file, which is exactly the state a
          # deleted or never-committed artifact would be in.
          git add --intent-to-add backend/openstategraph/compile/port_specs.json
          if ! git diff --exit-code -- backend/openstategraph/compile/port_specs.json; then
            echo "::error::backend/openstategraph/compile/port_specs.json is stale."
            cat <<'MSG'

          The TypeScript node catalogue (src/nodes/**) is authoritative for node
          types and ports; the Python compiler and the MCP vocabulary read the
          generated JSON above. You changed a node type or a port without
          regenerating it.

            npm run generate:ports
            git add backend/openstategraph/compile/port_specs.json

          MSG
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # `[all]` because a checkout exercises every surface — the HTTP API, the
      # MCP transport, deep agents, sqlite. A *consumer* installs the lean core
      # plus one provider extra; `backend/tests/test_distribution_metadata.py`
      # is what keeps that promise honest, since CI cannot see it from here.
      - run: pip install -e "backend[all,dev]" ruff
      - run: python -m ruff check backend
      # The type gate (ticket 05). Runs from `backend/` because `[tool.mypy]`
      # in backend/pyproject.toml is the config, and mypy reads the nearest
      # one. Ruff catches undefined names; this is what catches a wrong one.
      - run: cd backend && python -m mypy
      # Coverage ratchet: backend sits at 91% (2026-08-09); fail-under
      # guards regressions, raised as it climbs. Live-API tests stay opt-in.
      - run: python -m pytest -q --cov=backend/openstategraph --cov-fail-under=85
  # The proof a green test suite cannot give (framework-packaging §3.6): build
  # the wheel, install it in an EMPTY venv outside the checkout, and drive it
  # with cwd outside the repo and PYTHONPATH empty. `pytest.ini` puts a
  # workflow's tools on sys.path in-tree, so `backend` passing says nothing
  # about what an adopter gets — and the defects this catches are silent ones
  # (a module not shipped, package data missing, a path computed from
  # `__file__` that resolves into site-packages once installed).
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: scripts/clean_install_proof.sh

  # Docs freshness: code changes should carry their documentation. Pure
  # git + bash, no dependencies. Escape hatch: `docs: not-needed` in any
  # commit message in the PR.
  docs-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Code changes must touch docs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD")
          code=$(printf '%s\n' "$changed" | grep -E '^(src|backend)/' || true)
          if [ -z "$code" ]; then
            echo "No src/ or backend/ changes — nothing to check."; exit 0
          fi
          docs=$(printf '%s\n' "$changed" | grep -E '^(README\.md|docs/|openwiki/)' || true)
          if [ -n "$docs" ]; then
            echo "Docs updated alongside code:"; printf '%s\n' "$docs"; exit 0
          fi
          if git log --format='%B' "$BASE".."$HEAD" | grep -qF 'docs: not-needed'; then
            echo "Escape hatch found: a commit message says 'docs: not-needed'."; exit 0
          fi
          echo "::error::This PR changes src/ or backend/ but no documentation."
          cat <<'MSG'

          Code changed, docs did not.

          Please update one of:
            README.md      user-facing behaviour, setup, providers
            docs/          decisions and architecture notes
            openwiki/      generated reference (or let the workflow regenerate)

          If this change genuinely needs no docs, say so in a commit message:
            git commit --allow-empty -m "docs: not-needed — internal refactor only"

          MSG
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # ONE status check to require in branch protection, instead of six that have
  # to be re-listed by hand every time a job is added, renamed or given a
  # matrix. Adding a job to `needs:` below is how it becomes mandatory.
  #
  # `if: always()` is load-bearing — without it this job is *skipped* when a
  # dependency fails, and a skipped required check is treated as neutral, which
  # would turn the gate into decoration. So it always runs and inspects the
  # results itself. `skipped` is accepted because `docs-freshness` legitimately
  # skips on push-to-main; `cancelled` is not.
  ci-success:
    if: always()
    needs: [frontend, generated-port-specs, backend, clean-install, docs-freshness, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every check must have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required check reported '$result'."; exit 1 ;;
            esac
          done
          echo "All required checks passed."

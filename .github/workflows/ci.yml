name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify   # tsc + eslint + prettier-check + vitest
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # `[all]` because a checkout exercises every surface — the HTTP API, the
      # MCP transport, deep agents, sqlite. A *consumer* installs the lean core
      # plus one provider extra; `backend/tests/test_distribution_metadata.py`
      # is what keeps that promise honest, since CI cannot see it from here.
      - run: pip install -e "backend[all,dev]" ruff
      - run: python -m ruff check backend
      # Coverage ratchet: backend sits at 91% (2026-08-09); fail-under
      # guards regressions, raised as it climbs. Live-API tests stay opt-in.
      - run: python -m pytest -q --cov=backend/openstategraph --cov-fail-under=85
  # The proof a green test suite cannot give (framework-packaging §3.6): build
  # the wheel, install it in an EMPTY venv outside the checkout, and drive it
  # with cwd outside the repo and PYTHONPATH empty. `pytest.ini` puts a
  # workflow's tools on sys.path in-tree, so `backend` passing says nothing
  # about what an adopter gets — and the defects this catches are silent ones
  # (a module not shipped, package data missing, a path computed from
  # `__file__` that resolves into site-packages once installed).
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: scripts/clean_install_proof.sh

  # Docs freshness: code changes should carry their documentation. Pure
  # git + bash, no dependencies. Escape hatch: `docs: not-needed` in any
  # commit message in the PR.
  docs-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Code changes must touch docs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE" "$HEAD")
          code=$(printf '%s\n' "$changed" | grep -E '^(src|backend)/' || true)
          if [ -z "$code" ]; then
            echo "No src/ or backend/ changes — nothing to check."; exit 0
          fi
          docs=$(printf '%s\n' "$changed" | grep -E '^(README\.md|docs/|openwiki/)' || true)
          if [ -n "$docs" ]; then
            echo "Docs updated alongside code:"; printf '%s\n' "$docs"; exit 0
          fi
          if git log --format='%B' "$BASE".."$HEAD" | grep -qF 'docs: not-needed'; then
            echo "Escape hatch found: a commit message says 'docs: not-needed'."; exit 0
          fi
          echo "::error::This PR changes src/ or backend/ but no documentation."
          cat <<'MSG'

          Code changed, docs did not.

          Please update one of:
            README.md      user-facing behaviour, setup, providers
            docs/          decisions and architecture notes
            openwiki/      generated reference (or let the workflow regenerate)

          If this change genuinely needs no docs, say so in a commit message:
            git commit --allow-empty -m "docs: not-needed — internal refactor only"

          MSG
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

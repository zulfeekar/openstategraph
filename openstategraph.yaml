# OpenStateGraph — this repository's own runs.
#
# NOT a template. `openstategraph.example.yaml` is the annotated one to copy
# into your project; this file configures the checkout you are standing in, and
# it exists to hold exactly one decision.
#
# ---------------------------------------------------------------------------
# NO SECRETS. EVER. This file is committed. Keys live in .env, which is
# gitignored, and the loader refuses a file containing a key-shaped name or a
# key-shaped value. See .env.example.
# ---------------------------------------------------------------------------
#
# **Why this file exists** (install-experience T10, grill item G1(a)). Until
# 2026-08-15 all 22 shipped examples pinned `settings.model:
# "ollama:gpt-oss:120b-cloud"` in the document itself. That made the install
# line a lie for the twenty-two things a new adopter opens first: they install
# `openstategraph[anthropic]`, copy an example, press Run, and are told to
# install Ollama. The pin was never about those documents — it was about *this
# repository's* smoke runs and token budget, which is a repository-wide choice
# and belongs at repository level.
#
# So the documents inherit the instance default now (the provider integration
# you have installed), and the pin lives here. A copied example runs on
# whatever the adopter installed; runs made *here* go to Ollama cloud.
#
# **Ollama means Ollama CLOUD, never a local model.** Standing project
# instruction with direct evidence: `llama3.1:8b` locally could not hold
# structured output at all, took minutes per run, and answered a database
# question from parametric knowledge. `gpt-oss:120b-cloud` wrote a correct
# two-join GROUP BY in 23s. A local model turns a wiring bug and a capability
# gap into the same symptom, so the `-cloud` suffix is load-bearing.
# `backend/tests/test_documented_install.py` asserts both halves of this line.
#
# Reachability is `OLLAMA_API_KEY` (the cloud) or `OLLAMA_HOST` (a daemon you
# run, which owns its own auth) — in .env, never here.

version: 1

default_model: ollama:gpt-oss:120b-cloud

# Minted manually — this file predates kanban-patrol/03 and was never
# re-inited. kanban-patrol/23 (resolved 2026-09-04, `8d12578`) built the upgrade path for a config
# like this one; this line unblocks exercising the skill loop today.

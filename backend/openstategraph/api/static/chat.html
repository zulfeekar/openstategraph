<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenStateGraph Chat</title>
<style>
  /* One file, no dependencies — so the palette is a handful of custom
     properties defined once for light and re-declared once for dark, rather
     than a colour scattered through the rules. `color-scheme` still does the
     work for form controls and scrollbars. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #fbfbfd;
    --raised: #ffffff;
    --line: #e6e8ee;
    --line-soft: #f0f1f5;
    --text: #14171d;
    --muted: #6b7280;
    --faint: #9aa1ae;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --live: #2563eb;
    --done: #16a34a;
    --danger: #dc2626;
    /* The editor's `--color-status-warning`, restated: a run paused on a
       human decision is neither live nor done nor a failure. */
    --paused: #f59e0b;
    /* The editor's design tokens, restated in-file — this page is served
       standalone by the backend and cannot import `src/design`. Same 4px
       spacing ladder, same radius steps, same type ramp, so the two
       surfaces stay on one scale even though they share no stylesheet. */
    --space-px: 1px;
    --space-0-5: 0.125rem; /*  2px */
    --space-1: 0.25rem; /*  4px */
    --space-1-5: 0.375rem; /*  6px */
    --space-2: 0.5rem; /*  8px */
    --space-2-5: 0.625rem; /* 10px */
    --space-3: 0.75rem; /* 12px */
    --space-3-5: 0.875rem; /* 14px */
    --space-4: 1rem; /* 16px */
    --space-5: 1.25rem; /* 20px */
    --space-6: 1.5rem; /* 24px */
    --space-7: 1.75rem; /* 28px */
    --space-8: 2rem; /* 32px */

    --radius-xs: 3px;
    --radius-sm: 5px;
    --radius-md: 7px;
    --radius-lg: 9px;
    --radius-xl: 12px;
    --radius-2xl: 16px;
    --radius-full: 999px;
    /* `stable-beta-public/11` — one number, written twice: the editor's
       `--radius-bubble` (`src/design/styles/tokens.css`) is 10px, derived
       from 1.25× the bubble's own vertical padding. Restated here by value,
       same as every other token on this page, so `--chat-bubble-radius`
       (below) can point at one name on both surfaces instead of at
       `--radius-lg`, which this page's OWN scale (unlike the editor's flat
       one) happened to already be 9px — coincidence, not the source. */
    --radius-bubble: 10px;

    --font-size-10: 0.625rem;
    --font-size-11: 0.6875rem;
    --font-size-12: 0.75rem;
    --font-size-13: 0.8125rem;
    --font-size-14: 0.875rem;
    --font-size-16: 1rem;
    --font-size-20: 1.25rem;

    --font-weight-medium: 500;
    --font-weight-semibold: 600;

    --line-height-tight: 1.2;
    --line-height-snug: 1.35;
    --line-height-normal: 1.5;
    --line-height-relaxed: 1.65;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --surface: #12161c;
      --raised: #171b22;
      --line: #2b313b;
      --line-soft: #22272f;
      --text: #e8eaee;
      --muted: #9aa2b1;
      --faint: #6b7482;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .14);
      --live: #60a5fa;
      --done: #34d399;
      --danger: #f87171;
      --paused: #fbbf24;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: var(--font-size-14)/var(--line-height-normal) -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #split { flex: 1; display: flex; min-height: 0; }
  #flowpane { flex: 1; overflow: auto; padding: var(--space-5) var(--space-6); min-width: 0; background: var(--surface); }
  #flowpane h2 { margin: 0 0 var(--space-3-5); font-size: var(--font-size-11); color: var(--faint); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: .07em; }
  #chatcol { width: 440px; max-width: 440px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); min-height: 0; background: var(--bg); }
  @media (max-width: 900px) {
    #split { flex-direction: column; }
    #chatcol { width: 100%; max-width: none; border-left: none; border-top: 1px solid var(--line); }
    #flowpane { max-height: 42vh; }
  }

  /* ---------- Header ---------- */
  header { display: flex; gap: var(--space-2-5); align-items: center; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--bg); }
  header strong { margin-right: auto; font-size: var(--font-size-16); letter-spacing: -.01em; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); flex: none; }
  select, input, button, textarea {
    font: inherit; padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: var(--raised); color: inherit;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; transition: background .12s ease, border-color .12s ease; }
  button:hover { border-color: var(--faint); }
  #send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: var(--font-weight-semibold); padding-inline: var(--space-4); }
  #send:hover { filter: brightness(1.08); }
  /* Send becomes Stop while a turn streams — same button, same place, so the
   * control never moves out from under the pointer. Red from the existing
   * `--danger` token; the page gains no new colour. */
  #send[data-stop] { background: var(--danger); border-color: var(--danger); }
  /* A stop the user asked for is not a failure, so it reads muted like a
   * note — deliberately not `.error`. */
  .stopped { color: var(--muted); font-style: italic; font-size: var(--font-size-14); }
  #who { font-size: var(--font-size-12); color: var(--faint); font-variant-numeric: tabular-nums; }

  main { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-5); min-height: 0; }

  /* ---------- The conversation grammar (`stable-beta-public/10`) ----------
   *
   * The same four names the editor's chat panel declares on `.ask__thread`
   * (`src/view/ask/AskPanel.css`), resolving to the same tokens.
   *
   * This file restates the token *values* in its own `:root` above, because
   * it is a standalone asset served straight off the backend with no build
   * step. `--radius-xs` here is still the page's own separately authored
   * 3px, used for the bubble's squared-off corner — that divergence from the
   * editor's flat `--radius-xs` (0) is old and deliberate and out of this
   * ticket's scope. `--chat-bubble-radius` itself no longer divides the two
   * surfaces at all: `stable-beta-public/11` gave the editor its own rounded
   * `--radius-bubble` (`src/design/styles/tokens.css`, 10px) rather than
   * leaving it flat, and this page restates that same number under the same
   * name, so `var(--radius-lg)` below is not a coincidence any more — it is
   * a name this page happens not to need for the bubble now that
   * `--radius-bubble` exists. What must not diverge is the grammar: how
   * round a bubble is, how much room its text has, how far apart two
   * bubbles from one side sit, and how far apart the two sides sit.
   * `src/view/ask/chatBubblesAgree.test.ts` reads this file and
   * `AskPanel.css` as text and fails if the names or the token expressions
   * drift apart.
   *
   * Before `10` the page had none of them: a question was a small tinted box
   * on the right and an answer a full-width bordered rectangle — the same
   * shape as the composer below it. */
  #log {
    --chat-bubble-radius: var(--radius-bubble);
    --chat-bubble-padding: var(--space-2) var(--space-3);
    --chat-gap-group: var(--space-1);
    --chat-gap-side: var(--space-3);
    --chat-bubble-max-width: 78%;
    /* `stable-beta-public/13` — a list inside a bubble was reading like a
       printed page, on this surface too. */
    --chat-block-gap: var(--space-1);
    --chat-list-item-gap: var(--space-0-5);
  }

  /* ---------- Live flow ---------- */
  #flow { position: relative; }
  #flow svg { width: 100%; height: auto; }
  /* Everything that is not the active node steps back, so the active one pops
     without having to shout. */
  #flow.running .node { opacity: .38; transition: opacity .25s ease; }
  #flow .flow-active { opacity: 1 !important; }
  #flow .flow-active > * { stroke: var(--live) !important; stroke-width: 2.5px !important; }
  #flow .flow-active rect, #flow .flow-active polygon, #flow .flow-active circle { fill: color-mix(in srgb, var(--live) 16%, transparent) !important; }
  /* The path already taken keeps a faint tint, so the route through the graph
     is readable at the end of a run and not only during it. */
  #flow .flow-done { opacity: .8 !important; }
  #flow .flow-done > * { stroke: var(--done) !important; }
  #flow .flow-done rect, #flow .flow-done polygon { fill: color-mix(in srgb, var(--done) 10%, transparent) !important; }
  #flow path.flow-edge-active { stroke: var(--live) !important; stroke-width: 2.5px !important; opacity: 1 !important; }
  #flow.running path.flowchart-link { opacity: .3; transition: opacity .25s ease; }

  /* Paused on a human decision (UX-01).
     `#flow.running` is off — the rest of the diagram comes back out of its
     dimming, because nothing is executing to focus away from. The node the
     run parked on keeps a mark of its own: a STATIC amber ring, never the
     sweeping glow. The whole defect was that motion said "working" while the
     customer was being asked to decide. */
  #flow .flow-paused > * { stroke: var(--paused) !important; stroke-width: 2.5px !important; }
  #flow .flow-paused rect, #flow .flow-paused polygon, #flow .flow-paused circle { fill: color-mix(in srgb, var(--paused) 16%, transparent) !important; }
  /* An empty box the size of the paused node, so the badge below can be
     positioned against the node's own edges — the same overlay trick the
     running glow uses, and for the same reason (this is HTML over an SVG). */
  .flow-wait-anchor { position: absolute; pointer-events: none; }
  .flow-wait {
    position: absolute; inset-inline-start: 0; bottom: calc(100% + var(--space-1));
    padding: 0 var(--space-1-5); border-radius: var(--radius-sm); white-space: nowrap;
    font-size: var(--font-size-10); font-weight: var(--font-weight-semibold);
    letter-spacing: .04em; text-transform: uppercase; pointer-events: none;
    background: color-mix(in srgb, var(--paused) 20%, var(--raised));
    color: color-mix(in srgb, var(--paused) 80%, var(--text));
  }

  /* The running glow, in the editor's visual language (ticket 02).
     Was a blue `drop-shadow` pulse; the editor marks a running node with a
     rotating two-hue conic-gradient ring plus a ring-masked bloom, and the
     two surfaces should not describe the same state two ways.

     WHY AN HTML OVERLAY, NOT SVG. A conic gradient is a CSS *background*;
     an SVG shape can only be painted with an SVG paint server, and there is
     no conic equivalent (`foreignObject` inside Mermaid's output is not
     ours to add). The faithful options were: (a) an absolutely-positioned
     HTML ring over the node's box, or (b) an approximation in SVG — a
     dashed `stroke-dashoffset` chase, which is a *different* animation, not
     this one. (a) is chosen: it is the same gradient, the same mask, the
     same sweep. The diagram does not pan or zoom on this page — it is a
     `width:100%` SVG in a scrolling pane — so the overlay has nothing to
     fight; it lives inside `#flow` and therefore scrolls with the diagram,
     and it is repositioned on resize and removed on every node change and
     at the end of a run (see `placeGlow`). */
  @property --run-glow-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  :root {
    /* The editor's `--color-run-glow-from/to`, restated here — same reason
       as the spacing ladder above: this page cannot import `src/design`. */
    --color-run-glow-from: #3b82f6;
    --color-run-glow-to: #8b5cf6;
    --run-glow-width: var(--space-0-5);
    --run-glow-blur: var(--space-2);
  }
  @media (prefers-color-scheme: dark) {
    :root { --color-run-glow-from: #60a5fa; --color-run-glow-to: #a78bfa; }
  }
  .flow-glow { position: absolute; pointer-events: none; }
  .flow-glow::before, .flow-glow::after {
    content: ""; position: absolute; inset: calc(-1 * var(--run-glow-width));
    border-radius: calc(var(--radius-md) + var(--run-glow-width));
    background: conic-gradient(
      from var(--run-glow-angle),
      transparent 0deg,
      var(--color-run-glow-from) 30deg,
      var(--color-run-glow-to) 70deg,
      transparent 100deg
    );
    animation: run-glow-sweep 3s linear infinite;
    /* Masked to the border so only the ring survives — the node's own fill
       must stay readable underneath. */
    padding: var(--run-glow-width);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  /* The bloom: the same ring, blurred, behind the diagram rather than over it. */
  .flow-glow::after { z-index: -1; filter: blur(var(--run-glow-blur)); opacity: .7; }
  @keyframes run-glow-sweep { to { --run-glow-angle: 1turn; } }
  @media (prefers-reduced-motion: reduce) {
    .flow-glow::before, .flow-glow::after { animation: none; }
  }

  /* ---------- Empty state ---------- */
  .empty { padding: var(--space-7) var(--space-1); }
  .empty h3 { margin: 0 0 var(--space-1-5); font-size: var(--font-size-16); letter-spacing: -.01em; }
  .empty p { margin: 0; color: var(--muted); font-size: var(--font-size-14); }

  /* ---------- A turn ---------- */
  /* One turn: the question, then everything the workflow said back. The room
     below it is the room between two turns of one conversation — a bigger
     unit than the side change inside a turn, which is `--chat-gap-side`. */
  .turn { margin-bottom: var(--space-5); }
  .q {
    max-width: var(--chat-bubble-max-width); margin: 0 0 var(--chat-gap-side) auto; width: fit-content;
    padding: var(--chat-bubble-padding); background: var(--accent-soft);
    /* Square at the bottom right — the corner facing this side's own edge. */
    border-radius: var(--chat-bubble-radius) var(--chat-bubble-radius) var(--radius-xs) var(--chat-bubble-radius);
    font-size: var(--font-size-14);
    /* Same containment as `.answer` below, found in the same screenshot: a
       question with a URL in it ran off the right edge of its own bubble. */
    overflow-wrap: anywhere; word-break: break-word;
  }

  /* ---------- The workflow's side ----------
     Everything the run said back, in one group under one name: the steps
     strip, the timeline, the reasoning, a draft, an approval and the answer.
     Each keeps its own component — the ticket's instruction was *do not
     invent anything new* — and what changes is that they now sit inside one
     side of a conversation instead of stacking down the middle of the column
     at the same width as the composer.

     `align-items: stretch` on purpose: the answer caps its own width, while
     the boxes are panels and would look broken shrunk to their text. */
  .reply { display: flex; flex-direction: column; gap: var(--chat-gap-group); align-items: stretch; }
  /* Who is speaking, once per turn rather than once per bubble. No avatar:
     the product has no face for a workflow. */
  .who {
    margin: 0; color: var(--muted); font-size: var(--font-size-11);
    font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: .07em;
  }

  /* The steps are an activity strip, not a log: one quiet line per step, on a
     tinted rail, so they read as "what is happening" and never compete with
     the answer. */
  .steps {
    font-size: var(--font-size-12); color: var(--muted);
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--radius-lg); padding: var(--space-2) var(--space-2-5); margin: 0;
    display: flex; flex-direction: column; gap: var(--space-0-5);
  }
  .steps:empty { display: none; }
  .steps div { font-variant-numeric: tabular-nums; }
  /* A step talking about itself while it works (`launch-readiness/140`).
     The owner's words for what was wrong here were "not a text area but a
     beautiful thinking": the narration frames were arriving and landing in
     something that read as a plain box. What made it read that way was the
     frame around it, so what is left is a rail, a mark per line, and the
     newest line brighter than the ones behind it — the same presentation the
     editor's `Thinking` primitive draws, deliberately, so a customer and a
     developer are looking at one thing.

     It stacks rather than replacing in place, and it stays once the step
     finishes — it only stops pulsing. A stack that vanished at completion
     would lose the account of what happened, which for this audience (the one
     that cannot open a trace) is the only account there is. */
  .steps div.thinking {
    display: flex; flex-direction: column; gap: var(--space-1);
    /* A maximum, and the scroll is the point: an unbounded stack would push
       the answer off the screen on a long run. Matches the editor's
       `THINKING_MAX_HEIGHT`. */
    max-height: 420px; overflow-y: auto; overscroll-behavior: contain;
    margin: var(--space-1) 0; padding: var(--space-1) 0 var(--space-1) var(--space-4);
    border-inline-start: 1px solid var(--line-soft);
  }
  .steps div.thinking p {
    display: flex; align-items: baseline; gap: var(--space-2);
    margin: 0; color: var(--faint); font-style: italic;
    overflow-wrap: anywhere;
  }
  .steps div.thinking p::before {
    content: ""; flex: none; align-self: center;
    width: 5px; height: 5px; border-radius: 999px;
    /* Inside the padding box: a non-visible `overflow-y` clips anything
       that is not, which is how the first live run drew a rail with no
       marks on it. */
    margin-inline-start: -14px; background: var(--faint);
  }
  /* The present tense: the only line that is brighter and the only mark that
     moves. Everything above it has already happened, and a settled stack has
     no `.live` at all — a surface that keeps pulsing after the work is over is
     claiming work that is not happening. */
  .steps div.thinking.live > p:last-child { color: var(--muted); }
  .steps div.thinking.live > p:last-child::before {
    background: var(--accent); animation: thinking-pulse 1.1s ease-in-out infinite;
  }
  @keyframes thinking-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .steps div.thinking.live > p:last-child::before { animation: none; }
  }
  /* What the panel says while the wire is honestly quiet
     (`launch-readiness/141`). Measured on a 28-node package: the first narration
     frame does not leave the server until 4.99 s, because three nodes run
     before anything with a voice does. The frames that do arrive are prompt,
     so this is a silence to account for rather than a paint to fix — and the
     sentence names the wait, never the work, because nothing on the stream
     says what the next step is.

     It borrows the live narration line's presentation deliberately: it stands
     in the same place, in the same voice, and is removed the instant a real
     line can take over. It is NOT a `div.thinking.live` — `liveLine` claims
     that selector and would append narration into this box. */
  .steps p.waiting {
    display: flex; align-items: baseline; gap: var(--space-2);
    margin: var(--space-1) 0; padding-inline-start: var(--space-4);
    border-inline-start: 1px solid var(--line-soft);
    color: var(--muted); font-style: italic; overflow-wrap: anywhere;
  }
  .steps p.waiting::before {
    content: ""; flex: none; align-self: center;
    width: 5px; height: 5px; border-radius: 999px;
    margin-inline-start: -14px; background: var(--accent);
    animation: thinking-pulse 1.1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .steps p.waiting::before { animation: none; }
  }
  /* A spawn is an event in the run, not a step of it — indented under the
     node that spawned, and clipped to one line however long the task is. */
  .steps div.spawn {
    padding-inline-start: 12px;
    border-inline-start: 1px solid var(--line);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

  /* ---------- Read-only run timeline ---------- */
  details.tl { margin: 0; font-size: var(--font-size-12); }
  details.tl[hidden] { display: none; }
  details.tl > summary {
    cursor: pointer; list-style: none; color: var(--faint);
    text-transform: uppercase; letter-spacing: .07em; font-size: var(--font-size-10); font-weight: var(--font-weight-semibold);
    padding: var(--space-0-5) 0;
  }
  details.tl > summary::-webkit-details-marker { display: none; }
  details.tl > summary:hover { color: var(--muted); }
  .tl-body { display: flex; flex-direction: column; gap: var(--space-0-5); padding: var(--space-1-5) 0 var(--space-0-5); }
  .tl-row { display: grid; grid-template-columns: 1.1em minmax(0, 1fr) minmax(48px, 1.5fr) auto; gap: var(--space-1-5); align-items: center; color: var(--muted); }
  .tl-n { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tl-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .tl-track { height: 5px; border-radius: var(--radius-full); background: var(--line-soft); overflow: hidden; }
  .tl-bar { display: block; height: 100%; border-radius: var(--radius-full); background: var(--faint); }
  .tl-row[data-repeat] .tl-bar { background: #8b5cf6; }
  .tl-ms { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--faint); }
  .tl-note { color: var(--faint); margin: var(--space-1) 0 0; font-size: var(--font-size-11); }

  /* Capped, like the editor's: a peek at the reasoning, not a transcript that
     pushes the answer off the screen. */
  /* A reply the grader has still to judge (`every-workflow-green` 45).
     Built out of the pieces `.thinking` already uses — muted, dashed, small —
     and adding no colour: the run that produced the ticket showed a figure
     forty times larger than the database holds, and what was missing was a
     sentence saying it had not been checked, not more contrast.

     `user-select: none` on the whole region, notice included. A number
     selected out of an unsettled answer and pasted elsewhere arrives with
     nothing attached saying it was unsettled, which is exactly how three wrong
     figures were reported as results in one day. */
  .draft:not([hidden]) { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); margin-top: 0; user-select: none; -webkit-user-select: none; }
  .draft-notice { margin: 0 0 var(--space-1); font-size: var(--font-size-12); color: var(--muted); }
  .draft-text { font-size: var(--font-size-12); color: var(--muted); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow-y: auto; }
  .thinking { font-size: var(--font-size-12); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow-y: auto; }
  .thinking:not(:empty) { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); margin-top: 0; }
  /* The model's deliberation, kept visibly apart from the reply it is
     deliberating towards — see the `block` branch in `stream()`. Fainter and
     italic, because it is the one text on this page nobody should mistake for
     the answer. */
  .reasoning { font-size: var(--font-size-12); color: var(--faint); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 110px; overflow-y: auto; }
  .reasoning:not(:empty) { border-inline-start: 2px solid var(--line); padding: var(--space-1) var(--space-3); margin-top: 0; }
  /* Containment (ticket 27). A URL is a normal thing for the Web Researcher
     branch to answer with, and one arrived 400px wider than the card: the
     prose around it wrapped, the link ran off the right edge and stopped
     mid-word, and the card did not scroll to reach the rest. `overflow-x`
     alone was never going to cover it — a long token has no break
     opportunity, so it needs permission to break rather than somewhere to
     scroll. Both are declared: `overflow-wrap: anywhere` is the specified
     behaviour and also lets the token shrink its line box, `word-break` is
     the legacy alias `.ask__answer` already carries. The scroll stays for
     what genuinely cannot break — a wide table. */
  /* The workflow's bubble (`stable-beta-public/10`). This was a full-width
     raised card with a hairline border, and the border plus the full width is
     what made it read as a form field rather than as something somebody said.
     It is still the block in a turn with the most presence — the surface
     ground carries it against the page — but it is now a bubble: capped
     width, on the left, squared off against its own edge. */
  .answer {
    align-self: flex-start;
    background: var(--surface); border-radius: var(--chat-bubble-radius) var(--chat-bubble-radius) var(--chat-bubble-radius) var(--radius-xs);
    padding: var(--chat-bubble-padding); margin-top: 0; overflow-x: auto; font-size: var(--font-size-14);
    max-width: var(--chat-bubble-max-width); overflow-wrap: anywhere; word-break: break-word;
  }
  .answer > :first-child { margin-top: 0; } .answer > :last-child { margin-bottom: 0; }
  .answer h3, .answer h4, .answer h5 { margin: var(--space-3-5) 0 var(--space-1-5); font-size: var(--font-size-16); }
  /* `stable-beta-public/13` — a list inside a bubble read like a printed
     page here too: no rule below tightened `<p>`/`<ul>`/`<ol>` at all, so
     the browser default (~1em) carried both the intro-to-list gap and the
     gap between bullets — this page's `.answer` never set `white-space:
     pre-wrap`, so it never had the editor's phantom-line-per-tag-boundary
     defect (see `src/view/ask/AskPanel.css`'s longer account of that one);
     it just had no tightening at all. `table` keeps its own rule below (a
     table wants room on both sides, not just the bottom), so it is
     deliberately not part of this group. */
  .answer p, .answer ul, .answer ol, .answer blockquote { margin: 0 0 var(--chat-block-gap); }
  .answer ul, .answer ol { padding-left: var(--space-4); }
  .answer li + li { margin-top: var(--chat-list-item-gap); }
  .answer table { border-collapse: collapse; margin: var(--space-2) 0; }
  .answer td, .answer th { border: 1px solid var(--line); padding: var(--space-1) var(--space-2-5); }
  /* `rich-text--narrow` — a table in ~200px (`stable-beta-public/15`), the
     same modifier and the same decisions as `src/view/common/RichText.css`,
     restated here because this page is a standalone asset with no build step
     (the split `chatBubblesAgree.test.ts` describes). A five-row
     *Reason | Explanation* answer measured 838px of table behind 187px of
     bubble, cut mid-word, with nothing saying the rest existed. Two columns
     stack into rows — the first cell is the label, the second the text, both
     with the bubble's full width; three or more keep the scroller with a
     floor under each column, because stacking a wide table would print
     unlabelled lines. The class is doubled in every selector for the reason
     the editor stylesheet gives at length: it must out-specify a
     first-column rule, not merely follow it. */
  .rich-text--narrow.rich-text--narrow th,
  .rich-text--narrow.rich-text--narrow td { white-space: normal; word-break: normal; }
  .rich-text--narrow.rich-text--narrow td:first-child { width: auto; white-space: normal; }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) { display: block; width: 100%; overflow-x: visible; border: none; }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) thead { display: none; }
  /* This page's `md()` emits every row as `<td>` and no `<thead>`, so the
     rule above matches nothing here — and a markdown table always has a
     header row, so where there is no `<thead>` the first row is it. */
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))):not(:has(thead)) > tbody > tr:first-child { display: none; }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) tbody,
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) tr { display: block; width: auto; }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) tr { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-1) var(--space-2); margin: 0 0 var(--space-1); }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) td { display: block; width: auto; border: none; padding: 0; }
  .rich-text--narrow.rich-text--narrow table:not(:has(tr > :nth-child(3))) td:first-child { font-weight: var(--font-weight-semibold); color: var(--text); }
  .rich-text--narrow.rich-text--narrow table:has(tr > :nth-child(3)) { display: block; max-width: 100%; overflow-x: auto; }
  .rich-text--narrow.rich-text--narrow table:has(tr > :nth-child(3)) th,
  .rich-text--narrow.rich-text--narrow table:has(tr > :nth-child(3)) td { min-width: 5em; }
  .answer code, .answer pre { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: var(--space-px) var(--space-1-5); font-size: var(--font-size-13); }
  /* Wrapped, not scrolled. The Chinook answers' fenced SQL was wider than
     the card and scrolled sideways with no visible scrollbar — so nothing
     told the reader the rest of the query existed, which is the same outcome
     as clipping it. A wrapped SELECT is uglier than a scrolled one and is
     the only one of the two a customer can finish reading. */
  .answer pre { display: block; padding: var(--space-2-5) var(--space-3); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* `launch-readiness` 25 — a grader that ran out of attempts published a
     candidate it had rejected, and nothing before this told the reader.
     `--paused` (the same amber a human-approval pause uses) rather than
     `--danger`: the run did not fail, it is the honest "try again" loop
     running out, which is a different fact from an error. Sits above
     `.answer`, not inside it, so it survives whatever markdown renders. */
  .rejected-banner {
    display: flex; align-items: center; gap: var(--space-2);
    background: color-mix(in srgb, var(--paused) 12%, var(--raised));
    border: 1px solid var(--paused); border-radius: var(--radius-lg);
    padding: var(--space-2) var(--space-3); margin-top: 0;
    font-size: var(--font-size-13); color: var(--text);
  }
  /* `launch-readiness` 33 — an author rule that sets `display` unconditionally
     beats the UA stylesheet's `[hidden] { display: none }`, same specificity
     or not, because author styles always win over UA styles. So toggling the
     `hidden` attribute in JS (`rejectedBanner.hidden = !d.publishedRejected`)
     never actually hid this element — it was `display: flex` from the moment
     `turnEl()` created it, on every turn, grader or none. This guard is what
     makes `hidden` mean anything here. */
  .rejected-banner[hidden] { display: none; }
  .rejected-banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--paused); flex: none; }
  .error { color: var(--danger); }
  .hitl { border: 1px solid var(--line); border-radius: var(--radius-xl); padding: var(--space-3) var(--space-4); margin-top: 0; background: var(--surface); }

  /* ---------- The approval card ----------
   *
   * The most important thing on the page while it is up, and the *same*
   * design decision as the paused node on the diagram: the run is waiting on
   * a person, so the card carries the same amber accent the ring does rather
   * than inventing a second visual language for one state. No new colours —
   * `--paused`, `--accent` and `--danger` are all already in this file. */
  .hitl--approval {
    border-color: color-mix(in srgb, var(--paused) 45%, var(--line));
    background: color-mix(in srgb, var(--paused) 6%, var(--surface));
    padding: var(--space-4);
  }
  .hitl--approval > p { margin: 0 0 var(--space-3); }
  .hitl--approval b { color: color-mix(in srgb, var(--paused) 80%, var(--text)); }
  .hitl--approval .answer { margin-bottom: var(--space-3); }
  /* The grader's opinion of the draft (`workflow-gallery` 32) — secondary to
     the candidate, because it informs the decision and does not make it. */
  .hitl__verdict { margin: 0 0 var(--space-2); font-size: 0.9em; color: var(--color-text-secondary); }
  .hitl__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  /* Padding, radius and weight identical to `#send`, so the three controls a
     customer can press on this page agree with each other. */
  .hitl__actions button {
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-lg);
    font-weight: var(--font-weight-semibold);
    transition: background .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
  }
  /* Approve is the primary action and looks like it — the eye should land
     here first, so Reject is never solid at rest. */
  .btn-approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-approve:hover:not([disabled]) { filter: brightness(1.08); border-color: var(--accent); }
  .btn-reject { background: var(--raised); border-color: var(--danger); color: var(--danger); }
  .btn-reject:hover:not([disabled]) { background: var(--danger); border-color: var(--danger); color: #fff; }
  .hitl__actions button:active:not([disabled]) { filter: brightness(.94); }
  /* In flight: neither can be pressed twice (a double-click used to fire two
     resumes), and the one that was chosen keeps its colour while the other
     steps back — so the card still says what you decided. */
  .hitl__actions button[disabled] { cursor: default; }
  .hitl__actions button[disabled]:not([data-chosen]) { opacity: .4; }
  .hitl__note { margin: var(--space-2) 0 0; color: var(--muted); font-size: var(--font-size-13); }
  @media (max-width: 900px) {
    /* The pane stacks here, so the row gets the full width and the two
       controls stay comfortably tappable rather than shrinking. */
    .hitl__actions button { flex: 1 1 auto; min-width: 8rem; text-align: center; }
  }

  /* The catalogue notice bar: what a live `workflows.changed` event has to
     SAY rather than silently do. It is never used to swap the selection —
     only to tell the person their selection changed underneath them. */
  #notice { display: flex; gap: var(--space-2); align-items: baseline; padding: var(--space-2) var(--space-5);
            border-bottom: 1px solid var(--line); background: var(--accent-soft); color: var(--text);
            font-size: var(--font-size-13); }
  #notice[hidden] { display: none; }
  #notice span { flex: 1; }
  #notice button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: var(--font-size-14); }

  footer { display: flex; gap: var(--space-2); padding: var(--space-3-5) var(--space-5); border-top: 1px solid var(--line); background: var(--bg); }
  footer textarea { flex: 1; resize: none; height: 46px; border-radius: var(--radius-xl); }
</style>
</head>
<body>
<header>
  <span class="dot" aria-hidden="true"></span>
  <strong>OpenStateGraph</strong>
  <select id="wf" title="Workflow"></select>
  <button id="newconv" title="Start a fresh thread">New conversation</button>
  <span id="who" style="font-size:var(--font-size-12);color:var(--muted)"></span>
</header>
<div id="notice" hidden role="status"><span></span><button type="button" title="Dismiss">×</button></div>
<div id="split">
  <section id="flowpane">
    <h2>Live flow</h2>
    <div id="flow">select a workflow…</div>
  </section>
  <div id="chatcol">
    <main id="log">
      <div class="empty" id="empty">
        <h3>Ask anything</h3>
        <!-- The no-Auto wording, and the one `describeSelection` reads back
             out of the DOM as `SELECTED_LINE`. It is the safe thing to paint
             first: "Auto" exists only where the concierge package is
             installed, and whether it is takes a request to find out. -->
        <p>Your question goes to the workflow selected above — and you can watch it run in the live flow.</p>
      </div>
    </main>
    <footer>
      <textarea id="msg" placeholder="Ask the selected workflow…"></textarea>
      <button id="send" title="Enter sends. Shift+Enter starts a new line.">Send</button>
    </footer>
  </div>
</div>
<script src="/chat/mermaid.js"></script>
<script>
"use strict";
// No identity box: who a run is for is decided by the server from the
// request's authenticated context, never sent by this page. See
// `openstategraph/principal.py` and docs/deploying.md.
const $ = (id) => document.getElementById(id);
const state = {
  sessionId: sessionStorage.getItem("openstategraph.session") || crypto.randomUUID(),
  threads: JSON.parse(localStorage.getItem("openstategraph.threads") || "{}"),
  workflow: null, doc: null, pending: null,
};
sessionStorage.setItem("openstategraph.session", state.sessionId);
$("who").textContent = state.sessionId.slice(0, 8);

function threadFor(slug) {
  if (!state.threads[slug]) {
    state.threads[slug] = crypto.randomUUID();
    localStorage.setItem("openstategraph.threads", JSON.stringify(state.threads));
  }
  return state.threads[slug];
}
// What this page says it does — and it does two different things
// (production-ready 55.7). The empty state promised to route while the
// composer, two inches below it, said "Ask the selected workflow", and both
// said it unconditionally. Only one of them was ever right at a time:
// **Auto** is offered only where the `concierge` package is installed, and
// then it is the default; everywhere else the picker is the whole story.
//
// So the copy follows the picker rather than picking a side. The "selected"
// sentence is read out of the markup rather than re-typed, because a second
// copy of a sentence is how the first one came to be wrong for a version and
// a half — the duplicate lived in the "New conversation" handler, invisible
// until somebody pressed it.
const SELECTED_LINE = $("empty").querySelector("p").innerHTML;
const ROUTED_LINE = "I&rsquo;ll route it to the right workflow — and you can watch it run in the live flow.";
const routing = () => state.hasAuto && state.workflow === "concierge";
const emptyHtml = () =>
  '<div class="empty" id="empty"><h3>Ask anything</h3><p>'
  + (routing() ? ROUTED_LINE : SELECTED_LINE) + "</p></div>";

/** Re-say what the current selection means. Called on load and on every change. */
function describeSelection() {
  $("msg").placeholder = routing() ? "Ask anything — it will be routed…" : "Ask the selected workflow…";
  const empty = $("empty");
  if (empty) empty.outerHTML = emptyHtml();
}

$("newconv").onclick = () => {
  delete state.threads[state.workflow];
  localStorage.setItem("openstategraph.threads", JSON.stringify(state.threads));
  $("log").innerHTML = emptyHtml();
  // The diagram belongs to the conversation being cleared: leaving the run
  // marker (and its glow) behind would claim a run is still in flight in a
  // thread that no longer exists.
  resetFlowHighlight();
};

// Minimal markdown: headings, bold, code fences, inline code, tables, lists.
// Deliberately no raw HTML passthrough — everything is escaped first.
function md(text) {
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const lines = esc(text).split("\n");
  let out = [], inCode = false, inTable = false, inList = false;
  const closeAll = () => { if (inTable) { out.push("</table>"); inTable = false; } if (inList) { out.push("</ul>"); inList = false; } };
  for (const line of lines) {
    if (line.startsWith("```")) { closeAll(); out.push(inCode ? "</pre>" : "<pre>"); inCode = !inCode; continue; }
    if (inCode) { out.push(line); continue; }
    let l = line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    // A blank line inside a table is not a GFM table terminator on its own —
    // only a following non-blank, non-row line is. Without this, a model
    // that puts a blank line between rows (common, tolerated by several
    // markdown dialects) splits one table into two, or strands the next row
    // as a paragraph of raw pipes (`18`).
    if (inTable && !l.trim()) continue;
    if (/^\s*\|.*\|\s*$/.test(l)) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      if (!inTable) { closeAll(); out.push("<table>"); inTable = true; }
      out.push("<tr>" + l.trim().slice(1, -1).split("|").map((c) => "<td>" + c.trim() + "</td>").join("") + "</tr>");
      continue;
    }
    if (/^\s*[-*] /.test(l)) { if (!inList) { closeAll(); out.push("<ul>"); inList = true; } out.push("<li>" + l.replace(/^\s*[-*] /, "") + "</li>"); continue; }
    closeAll();
    const h = l.match(/^(#{1,4}) (.*)$/);
    if (h) { out.push(`<h${h[1].length + 2}>${h[2]}</h${h[1].length + 2}>`); continue; }
    if (l.trim()) out.push("<p>" + l + "</p>");
  }
  closeAll();
  if (inCode) out.push("</pre>");
  return out.join("\n");
}

// --- Live flow view (ticket 68, as the user actually meant it): the
// active workflow's compiled graph, with the node currently processing lit
// up as stream frames arrive. Same safe_name rule as the compiler.
const flow = { slug: null, ready: false };
const safeName = (id) => id.replace(/[^a-zA-Z0-9_]/g, "_");
const darkMode = matchMedia("(prefers-color-scheme: dark)");
// Re-render rather than restyle: Mermaid bakes its palette into the SVG it
// emits (inline, with `!important`), so a scheme change means asking it again.
darkMode.addEventListener("change", () => { flow.ready = false; void renderFlow(flow.slug); });

/**
 * Re-tints the diagram for dark mode.
 *
 * It has to happen in the *source*, not in CSS and not in Mermaid's theme:
 * `draw_mermaid()` emits its own `classDef default fill:#f2f0ff` lines, which
 * Mermaid turns into an inline `style="fill:… !important"` on every node rect.
 * An inline `!important` cannot be overridden from a stylesheet, and a theme
 * variable loses to an explicit classDef — so the honest place to change it is
 * the one declaration that actually decides. Everything else (edges, labels,
 * edge-label backgrounds) still comes from the theme variables above.
 */
function themeMermaid(text) {
  if (!darkMode.matches) return text;
  return text
    .replace(/fill:#f2f0ff/g, "fill:#1c2129,color:#e8eaee,stroke:#3a4250")
    .replace(/fill:#bfb6fc/g, "fill:#2c2748,color:#e8eaee,stroke:#4a4270");
}

async function renderFlow(slug) {
  const host = $("flow");
  if (flow.slug === slug && flow.ready) return;
  flow.slug = slug; flow.ready = false;
  // Nothing selected means nothing published, which means there is nothing to
  // compile and no request to make (workflow-gallery 43, production-ready 54).
  // `renderPicker` already falls through to `""` correctly and says so in
  // words; this used to interpolate that empty slug straight into the path —
  // `GET /api/workflows//graph` — and render the 404 as the pane's empty
  // state, so the first minute of every install read "no compiled view: 404".
  if (!slug) { flow.ready = true; host.innerHTML = 'No workflows are published yet — <a href="/">open the editor</a>, open its Workflows panel, and press Publish on one.'; return; }
  host.textContent = "compiling…";
  try {
    // `audience=customer`: the compiler's own names — `__start__`,
    // `__default_error_handler__`, `safe_name`d ids, branch ids — are not this
    // reader's vocabulary. The editor asks the same endpoint without it and
    // still gets the ids it debugs with.
    const resp = await fetch(`/api/workflows/${slug}/graph?audience=customer`);
    // A status code is not a sentence. Whatever went wrong, what this reader
    // needs to know is that the diagram is missing, not that it was a 404.
    if (!resp.ok) { host.textContent = "This workflow has no diagram to show."; return; }
    const { mermaid: text } = await resp.json();
    const source = themeMermaid(text);
    // The diagram has to follow the page's scheme too — a light-on-white
    // flowchart dropped into a dark shell was the loudest thing on the screen.
    // The diagram must follow the page's scheme — a light-on-white flowchart
    // in a dark shell was the loudest thing on the screen.
    //
    // It has to be done through Mermaid's own theme variables, not CSS:
    // Mermaid writes `style="fill:… !important"` *inline* on every node rect,
    // and an inline `!important` cannot be overridden from a stylesheet. That
    // is also why `mainBkg` is set alongside `primaryColor` — the node fill
    // comes from the former, and setting only the latter left pale boxes
    // carrying pale text.
    const dark = darkMode.matches;
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "base",
      themeVariables: dark
        ? {
            darkMode: true,
            background: "#12161c", mainBkg: "#1c2129", primaryColor: "#1c2129",
            primaryTextColor: "#e8eaee", nodeTextColor: "#e8eaee", textColor: "#e8eaee",
            primaryBorderColor: "#3a4250", nodeBorder: "#3a4250",
            lineColor: "#6b7482", edgeLabelBackground: "#12161c",
            secondaryColor: "#22272f", tertiaryColor: "#171b22",
            clusterBkg: "#171b22", clusterBorder: "#2b313b", fontSize: "13px",
          }
        : {
            background: "#fbfbfd", mainBkg: "#ffffff", primaryColor: "#ffffff",
            primaryTextColor: "#14171d", nodeTextColor: "#14171d", textColor: "#14171d",
            primaryBorderColor: "#c7ccd6", nodeBorder: "#c7ccd6",
            lineColor: "#9aa1ae", edgeLabelBackground: "#fbfbfd",
            secondaryColor: "#f4f5f8", tertiaryColor: "#f8f9fb",
            clusterBkg: "#f8f9fb", clusterBorder: "#e6e8ee", fontSize: "13px",
          },
    });
    const { svg } = await mermaid.render("flow-" + Date.now(), source);
    host.innerHTML = svg;
    flow.ready = true;
    // A theme switch re-renders the diagram from scratch, which throws away
    // every mark on it. A run waiting for a decision is still waiting, so the
    // one mark that is a *claim about right now* is re-applied — losing it
    // would leave the same silence this ticket is about, just triggered by
    // the OS turning dark at sunset.
    const waiting = pausedFlowId;
    resetFlowHighlight();
    if (waiting) pauseFlow(waiting);
  } catch (err) {
    host.textContent = "flow view unavailable: " + err;
  }
}

// Active-node indication, as strong as the DOM Mermaid gives us allows.
//
// Three signals rather than one, because a single colour swap on one node in a
// twenty-node diagram is genuinely easy to miss:
//   1. the active node pulses and keeps full opacity while everything else is
//      dimmed — the contrast, not the colour, is what draws the eye;
//   2. the edge(s) *into* the active node light up, so the route the run took
//      to get there is visible, not just where it ended up;
//   3. every node already visited keeps a faint green "done" tint, so at the
//      end of a run the whole path taken is still on screen.
//
// Selectors are read off Mermaid's own output rather than assumed: nodes are
// `<prefix>-flowchart-<name>-<n>`, edges are `<prefix>-L_<src>_<dst>_0`. Both
// were confirmed against a rendered graph before being relied on here.
let activeFlowNode = null;
let activeFlowName = null;
/** The node a `human.approval` interrupt parked the run on, if any — the
 *  element, and separately its id, which survives a re-render of the SVG. */
let pausedFlowNode = null;
let pausedFlowId = null;
const visitedFlowNodes = new Set();
// Names this page was asked to light and the diagram does not draw. Reported
// once each — a run can ask for the same missing name a hundred times, and a
// hundred identical console lines is a silence with extra steps. Not cleared
// per run: the disagreement is between the compiler and this file, so it is
// the same disagreement on the next turn.
const unresolvedFlowNames = new Set();

/* The running glow is one HTML element, reused for the life of the page and
 * moved onto whichever node is active (ticket 02) — see the `.flow-glow`
 * rules for why a CSS conic gradient cannot live inside the SVG itself.
 *
 * Positioned from `getBoundingClientRect` rather than `getBBox` + CTM maths:
 * the rect is already in CSS pixels with the SVG's own `viewBox` scaling and
 * every ancestor transform applied, which is exactly what an absolutely
 * positioned sibling needs, and it stays correct when the pane reflows. Both
 * rects are read in the same frame, so the difference is scroll-independent
 * and the overlay scrolls with the diagram it sits inside. */
let glowEl = null;

function removeGlow() {
  if (glowEl) { glowEl.remove(); glowEl = null; }
}

/** Sizes and positions an absolute overlay onto one diagram node. */
function placeOver(overlay, el) {
  const host = $("flow");
  const hostBox = host.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  overlay.style.left = (box.left - hostBox.left) + "px";
  overlay.style.top = (box.top - hostBox.top) + "px";
  overlay.style.width = box.width + "px";
  overlay.style.height = box.height + "px";
}

function placeGlow(el) {
  if (!el || !el.isConnected) return removeGlow();
  if (!glowEl) {
    glowEl = document.createElement("div");
    glowEl.className = "flow-glow";
    glowEl.setAttribute("aria-hidden", "true");
    $("flow").appendChild(glowEl);
  }
  placeOver(glowEl, el);
}

/* The "Waiting for you" badge over a node the run is paused on (UX-01).
 *
 * A second overlay rather than a state of the glow: the glow *is* the sweep,
 * and the point of this state is that there is no sweep. Keeping them
 * separate means neither can be left half-applied. */
let waitEl = null;

function removeWait() {
  if (waitEl) { waitEl.remove(); waitEl = null; }
}

function placeWait(el) {
  if (!el || !el.isConnected) return removeWait();
  if (!waitEl) {
    waitEl = document.createElement("div");
    waitEl.className = "flow-wait-anchor";
    waitEl.innerHTML = '<span class="flow-wait">Waiting for you</span>';
    $("flow").appendChild(waitEl);
  }
  placeOver(waitEl, el);
}

// The diagram is a `width:100%` SVG, so a pane resize rescales it and the
// overlay's box goes stale. One observer for the life of the page — it is
// created once and never re-created per run, so there is nothing to leak.
new ResizeObserver(() => {
  if (glowEl) placeGlow(activeFlowNode);
  if (waitEl) placeWait(pausedFlowNode);
}).observe($("flow"));

function resetFlowHighlight() {
  const host = $("flow");
  host.classList.remove("running");
  for (const el of host.querySelectorAll(".flow-active, .flow-done, .flow-edge-active, .flow-paused")) {
    el.classList.remove("flow-active", "flow-done", "flow-edge-active", "flow-paused");
  }
  activeFlowNode = null;
  activeFlowName = null;
  pausedFlowNode = null;
  pausedFlowId = null;
  visitedFlowNodes.clear();
  removeGlow();
  removeWait();
}

/* The element the diagram draws `name` as, or null.
 *
 * Compared as strings rather than through a selector, and that is a fix and
 * not a style: since `workflow-gallery` 28 opened the mounts, a node inside
 * one is spelled `wf_music\3aagent_sql` — a mermaid id containing a literal
 * backslash. `CSS.escape` escapes *identifiers*, this is an attribute-value
 * string, and stacking the two grammars on one name is a thing to get wrong
 * rather than a thing to read. `includes` has no grammar at all.
 *
 * Two spellings, in order: mermaid's own `-flowchart-<id>-<n>`, then any id
 * carrying the name between separators, which is what a `subgraph` cluster and
 * an older mermaid both produce. */
function flowNodeEl(name) {
  if (!name) return null;
  const host = $("flow");
  const full = `-flowchart-${name}-`;
  const tail = `-${name}-`;
  let loose = null;
  for (const el of host.querySelectorAll("[id]")) {
    if (el.id.includes(full)) return el;
    if (!loose && el.id.includes(tail)) loose = el;
  }
  return loose;
}

/* The `subgraph` cluster the diagram draws `name` as, or null.
 *
 * A separate lookup from `flowNodeEl` because the two answer different
 * questions: a node is somewhere a ring can go, a cluster is a region that
 * contains one. Mermaid gives a cluster the bare name with no `-flowchart-`
 * infix and no trailing index, so it is an id SUFFIX rather than an infix —
 * which is also why the node lookup's `-<name>-` never matched it. */
function flowClusterEl(name) {
  if (!name) return null;
  for (const el of $("flow").querySelectorAll("g.cluster[id]")) {
    if (el.id.endsWith(`-${name}`)) return el;
  }
  return null;
}

/* Which box in the diagram a frame is inside — `frameOwner`'s counterpart.
 *
 * Both read the same `path`, from opposite ends, and both are right about
 * their own surface. The step list folds a mounted run into one row, so it
 * takes `path[0]`; the diagram **opens** the mount (`workflow-gallery` 28 and
 * 56), so it must take the leaf, or it points at a box that is not drawn any
 * more. That was the whole bug: every frame from inside a mount carries
 * `activeNode: "wf-music"`, which was the honest answer right up until there
 * stopped being a `wf_music` node to light.
 *
 * The spelling is the compiler's, not a guess. `compile/composition.py` joins
 * a nested mount path with `_` (`mount_segment`) and splices under
 * `<segment>:<id>` (`Graph.extend(prefix=…)`); mermaid renders that colon as
 * the CSS escape `\3a`. So `["wf-music", "agent-sql"]` is `wf_music\3aagent_sql`
 * and `["a", "b", "c"]` is `a_b\3ac`.
 *
 * A ladder rather than one answer, shortening from the leaf: a child document
 * the preview route could not load leaves its mount drawn as a single box
 * (`api/routes/workflows.py` says so), and then `wf_music` is the only name
 * there is. Falls through to `activeNode` for a backend that sends no `path`,
 * which is exactly the behaviour that existed before this function. */
function flowFrameName(d) {
  const parts = ((d && d.path) || []).map(safeName).filter(Boolean);
  const names = [];
  for (let i = parts.length; i > 0; i--) {
    const head = parts.slice(0, i - 1).join("_");
    names.push(head ? `${head}\\3a${parts[i - 1]}` : parts[i - 1]);
  }
  for (const name of names) if (flowNodeEl(name)) return name;
  // A mount whose box this diagram opened into a `subgraph` is drawn as a
  // cluster and not as a node, so there is honestly nowhere to put the ring —
  // and that is not the compiler and this page disagreeing, so it must not be
  // reported as one. It happens exactly once per mount, on the mount's own
  // completion frame (`path: ["wf-music"]`), and "" leaves the marker on the
  // child it is already on rather than clearing it for the one frame between
  // the last child and whatever the mount feeds.
  for (const name of names) if (flowClusterEl(name)) return "";
  return safeName(String((d && d.activeNode) || ""));
}

/* `name` is a DIAGRAM name — `flowFrameName`'s answer, already safe. Callers
 * must not hand this a raw node id: a mounted node's name carries a backslash
 * that `safeName` would flatten into the name of nothing. */
function highlightFlow(name) {
  if (!flow.ready || !name) return;
  const host = $("flow");
  host.classList.add("running");
  // A frame is arriving, so whatever was waiting for a human is not waiting
  // any more — the resumed run is executing. Cleared before the no-op guard
  // below, because the first frame of a resume is usually the paused node
  // itself and would otherwise return early with its badge still on.
  if (pausedFlowNode) {
    pausedFlowNode.classList.remove("flow-paused");
    pausedFlowNode = null;
    pausedFlowId = null;
    removeWait();
  }
  // Re-marking the node that is already active is a no-op visually but would
  // restart the ring animation on every internal frame of a chatty agent
  // loop, which reads as a stutter. Now that internal frames move the marker
  // (ticket 01), that path is hot enough to guard.
  if (activeFlowName === name) return;
  activeFlowName = name;

  if (activeFlowNode) {
    activeFlowNode.classList.remove("flow-active");
    activeFlowNode.classList.add("flow-done");
  }
  for (const p of host.querySelectorAll("path.flow-edge-active")) p.classList.remove("flow-edge-active");

  const el = flowNodeEl(name);
  if (el) {
    el.classList.remove("flow-done");
    el.classList.add("flow-active");
    activeFlowNode = el;
    visitedFlowNodes.add(name);
    placeGlow(el);
  } else {
    // Nothing on this diagram matches — a stale ring over the previous node
    // would claim the run is somewhere it is not.
    //
    // …and it says so, once per name. Silence is how the mount bug survived:
    // clearing the ring asserts nothing false, the run really had moved on,
    // and the missing highlight read as an animation quirk rather than as the
    // compiler and this page disagreeing about what a node is called. A ring
    // that cannot find its node is a defect, and a defect should cost a
    // developer one console line instead of a bug report.
    if (!unresolvedFlowNames.has(name)) {
      unresolvedFlowNames.add(name);
      console.warn(`live flow: no node named ${name} in this diagram — the highlight has nowhere to go`);
    }
    removeGlow();
  }

  // Edges landing on this node. Matching on the id's tail is deliberate: a
  // node name may itself contain underscores, so `L_<src>_<dst>_0` cannot be
  // split reliably — but the destination is always the suffix.
  for (const path of host.querySelectorAll("path.flowchart-link")) {
    if (path.id.endsWith(`_${name}_0`)) path.classList.add("flow-edge-active");
  }
}

/* A run paused on a human decision — NOT a run that is going (UX-01).
 *
 * The bug this replaces: the `interrupt` frame ends the stream, but the page
 * only rendered the approval card, so `#flow.running` stayed on. Every other
 * node kept its dimming, the edges stayed faded and the conic-gradient ring
 * kept sweeping over the paused node — the diagram claiming to work while the
 * customer was the one being asked to act.
 *
 * So: drop the "running" treatment entirely, and mark the paused node
 * distinctly instead — a static amber ring plus a "Waiting for you" badge. It
 * is deliberately not `flow-done` either; the node has not finished. */
function pauseFlow(name) {
  const host = $("flow");
  host.classList.remove("running");
  removeGlow();
  for (const p of host.querySelectorAll("path.flow-edge-active")) p.classList.remove("flow-edge-active");
  // The frame names the node that is actually waiting — the approval node,
  // which never reports an `update` of its own because it never completes.
  // The last node that *did* report is only the fallback, for an older
  // backend or a name this diagram does not contain.
  //
  // `name` is a DIAGRAM name, and this held the second copy of the selector
  // pair `highlightFlow` had, so it had the mount bug too: an approval inside
  // a mounted workflow stopped the run, the page said so in words, and the
  // diagram showed nothing waiting anywhere.
  const el = flowNodeEl(name) || activeFlowNode;
  if (activeFlowNode && activeFlowNode !== el) {
    activeFlowNode.classList.remove("flow-active");
    activeFlowNode.classList.add("flow-done");
  }
  activeFlowNode = null;
  activeFlowName = null;
  if (!el) return;
  el.classList.remove("flow-active");
  el.classList.add("flow-paused");
  pausedFlowNode = el;
  pausedFlowId = name || null;
  placeWait(el);
}

/** End of a run: stop dimming, and leave the path taken marked. */
function finishFlow() {
  const host = $("flow");
  host.classList.remove("running");
  // A run that reached an ending is no longer waiting on anyone — including
  // one that ended straight after a pause (approve, then a failure).
  if (pausedFlowNode) {
    pausedFlowNode.classList.remove("flow-paused");
    pausedFlowNode.classList.add("flow-done");
    pausedFlowNode = null;
  }
  pausedFlowId = null;
  removeWait();
  if (activeFlowNode) {
    activeFlowNode.classList.remove("flow-active");
    activeFlowNode.classList.add("flow-done");
    activeFlowNode = null;
  }
  activeFlowName = null;
  removeGlow();
  for (const p of host.querySelectorAll("path.flow-edge-active")) p.classList.remove("flow-edge-active");
}

/* ---------------- Run timeline (read-only) ----------------
 *
 * The same idea as the editor's Ask panel timeline, reduced to what a
 * customer benefits from: which steps fired, in what order, and where the
 * time went. Collapsed by default — it is diagnostic detail, not the answer.
 *
 * Same folding rules as the editor's `buildTimeline`, and the same honesty
 * about the numbers: a step's duration is the gap until the next frame, since
 * the stream reports a node only after it finishes. */
function renderTimeline(el, rows, names) {
  names = names || {};
  const box = el.querySelector("details.tl");
  const body = box.querySelector(".tl-body");
  const steps = [];
  const visits = {};
  // Bars still waiting for their node's own completion frame — see
  // `frameOwner`. LangGraph emits a node's inner frames BEFORE that node
  // finishes, so folding an internal frame into "the last bar" charged every
  // agent's loop to whatever ran before it (ticket 72).
  const open = {};
  let clock = 0;
  for (const row of rows) {
    const d = Math.max(0, row.ms || 0);
    const last = steps[steps.length - 1];
    const owner = row.owner || "";
    if (row.internal) {
      let target = owner ? open[owner] : last;
      if (!target && owner) {
        visits[displayName(owner)] = (visits[displayName(owner)] || 0) + 1;
        target = { label: displayName(owner), ns: null, taskId: row.taskId, ms: 0,
                   start: clock, count: 1, internal: 0, visit: visits[displayName(owner)] };
        steps.push(target);
        open[owner] = target;
      }
      if (target) { target.ms += d; target.internal++; }
      clock += d;
      continue;
    }
    if (owner && open[owner]) {
      // Close the bar this node's own steps already opened, rather than
      // drawing a second, empty one beside it.
      open[owner].ms += d;
      delete open[owner];
      clock += d;
      continue;
    }
    const ns = (row.namespace && row.namespace[0]) || null;
    if (ns && last && last.ns === ns && last.taskId === row.taskId) { last.ms += d; last.count++; clock += d; continue; }
    const label = (row.taskId && names["task:" + row.taskId])
      || (ns && names["ns:" + ns]) || ns || displayName(row.node);
    visits[label] = (visits[label] || 0) + 1;
    steps.push({ label, ns, taskId: row.taskId, ms: d, start: clock, count: 1, internal: 0, visit: visits[label] });
    clock += d;
  }
  if (!steps.length) { box.hidden = true; return; }
  box.hidden = false;
  box.querySelector(".tl-count").textContent = steps.length + (steps.length === 1 ? " step" : " steps");
  box.querySelector(".tl-total").textContent = fmtMs(clock);
  body.innerHTML = "";
  for (const s of steps) {
    const row = document.createElement("div");
    row.className = "tl-row";
    if (s.visit > 1) row.dataset.repeat = "1";
    const width = clock > 0 ? Math.max(1.5, (s.ms / clock) * 100) : 100;
    const offset = clock > 0 ? Math.min(98.5, (s.start / clock) * 100) : 0;
    row.innerHTML = '<span class="tl-n"></span><span class="tl-label"></span>'
      + '<span class="tl-track"><span class="tl-bar"></span></span><span class="tl-ms"></span>';
    row.querySelector(".tl-n").textContent = steps.indexOf(s) + 1;
    row.querySelector(".tl-label").textContent = s.label + (s.visit > 1 ? " ×" + s.visit : "") + (s.ns ? " ⊞" + s.count : "");
    row.querySelector(".tl-label").title = s.label + (s.internal ? " · " + s.internal + " internal steps" : "");
    const bar = row.querySelector(".tl-bar");
    bar.style.marginInlineStart = offset + "%";
    bar.style.width = width + "%";
    row.querySelector(".tl-ms").textContent = fmtMs(s.ms);
    body.appendChild(row);
  }
}
// Mirrors src/view/ask/traceDuration.ts (ticket 84): a sub-millisecond gap is
// real — a grader's deterministic reject skips the model entirely and can
// measure 0.02 ms — and printing "0 ms" reads as a broken timer rather than
// as the truth. This page is a separate implementation of the same idea
// because it has no build step to import the shared module from (ticket 82).
const fmtMs = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : ms < 1 ? "<1 ms" : Math.round(ms) + " ms");

/* Repaints the picker from a catalogue listing, PRESERVING the selection.
 *
 * The preservation is the whole point. A refresh that rebuilt the options and
 * let the browser fall back to the first one would silently move a customer
 * from the workflow they chose to whatever happens to sort first — and would
 * do it mid-conversation, since the thread is keyed by slug.
 *
 * Returns true when the current selection is no longer in the catalogue; the
 * caller says so out loud. The row is kept, labelled, rather than removed:
 * removing it is the silent swap again, one step later. */
function renderPicker(list) {
  const sel = $("wf");
  const chosen = state.workflow || (state.hasAuto ? "concierge" : (list[0] && list[0].slug) || "");
  // "Auto" is the hidden concierge gateway (ticket 67): a predefined
  // router-of-workflows the customer never has to know about — **when the
  // install has one**. `surface=chat` never lists it (it is hidden), so the
  // page cannot infer its absence from the catalogue and used to offer it
  // unconditionally. On a fresh `pip install`, which ships no `workflows/`,
  // the picker's first and default entry answered "no compiled view: 404"
  // (reviews-2026-08-14 ticket 04 / canvas-feels-right ticket 04).
  // A name is a label; the slug is the identity. Two published packages may
  // legitimately share a name — and by default they do, because a new document
  // is called "AI Workflow" and most people save before renaming — which put
  // two identical <option>s in front of a customer, with the default one
  // arbitrary and picking the wrong one undetectable
  // (the-editor-makes-a-real-package 07). So the slug is appended **only where
  // the name does not already tell them apart**: a customer picker should not
  // wear folder names it does not need, and the "no longer available" row
  // below already shows a bare slug for the same reason.
  const duplicated = new Set(
    list
      .map((w) => (w.name || "").trim().toLowerCase())
      .filter((name, index, all) => all.indexOf(name) !== index),
  );
  const optionLabel = (w) =>
    duplicated.has((w.name || "").trim().toLowerCase())
      ? `${esc(w.name)} — ${esc(w.slug)}`
      : esc(w.name);
  const options = (state.hasAuto
    ? ['<option value="concierge">Auto — let OpenStateGraph route</option>']
    : []
  ).concat(list.map((w) => `<option value="${esc(w.slug)}">${optionLabel(w)}</option>`));
  if (options.length === 0) {
    options.push('<option value="">No workflows are published yet</option>');
  }
  const gone = chosen !== "concierge" && chosen !== "" && !list.some((w) => w.slug === chosen);
  if (gone) options.push(`<option value="${esc(chosen)}">${esc(chosen)} — no longer available</option>`);
  sel.innerHTML = options.join("");
  sel.value = chosen;
  return gone;
}

async function loadWorkflows() {
  // launch-readiness 34: this used to be a second request — `GET
  // /api/workflows/concierge/summary`, read for its 200/404 — issued on
  // every page load, on every install, including every wheel install,
  // where `concierge` never ships and the request 404s every single time,
  // silently. The list endpoint now answers the same question about the
  // same request it already makes, in an `X-Auto-Available` header, so a
  // wheel install spends one round trip on `/chat` instead of two, and the
  // second one is never a guaranteed miss.
  const resp = await fetch("/api/workflows?surface=chat");
  const list = await resp.json();
  state.hasAuto = resp.headers.get("X-Auto-Available") === "true";
  state.workflow = state.hasAuto ? "concierge" : (list[0] && list[0].slug) || "";
  renderPicker(list);
  describeSelection();
  $("wf").onchange = async () => {
    state.workflow = $("wf").value; state.doc = null;
    hideNotice();
    // Auto and a named workflow are different products from where the reader
    // sits; the page says which one they are looking at (55.7).
    describeSelection();
    void renderFlow(state.workflow);
  };
  void renderFlow(state.workflow);
}

// --- Live catalogue (SSE) --------------------------------------------------
//
// The page used to fetch its picker once, on load: a customer sitting here
// when someone published a workflow never saw it without a reload. `GET
// /api/events` streams `workflows.changed` hints and this refetches on each
// one — the catalogue itself stays the single source of truth, the event is
// only a nudge to go and look.
//
// SSE rather than a WebSocket or a poll: it is one-way, the server already
// speaks it, and `EventSource` reconnects on its own. Everything below is
// **strictly additive** — if `EventSource` is missing, or the stream fails for
// good, the page behaves exactly as it did before, silently.
//
// Known limits, so nobody has to discover them: the backend's fan-out is
// in-process (one uvicorn worker — the documented ceiling), and a
// `workflow.json` hand-edited on disk emits nothing, because the editor writes
// through the API and a text editor does not.

function showNotice(text) {
  const bar = $("notice");
  bar.querySelector("span").textContent = text;
  bar.hidden = false;
}
function hideNotice() { $("notice").hidden = true; }
$("notice").querySelector("button").onclick = hideNotice;

/** Refetch the catalogue and repaint, disturbing nothing else. */
async function refreshPicker(reason, slug) {
  let list;
  try {
    const resp = await fetch("/api/workflows?surface=chat");
    if (!resp.ok) return;
    list = await resp.json();
  } catch { return; }  // A failed refresh leaves the last good picker in place.
  const gone = renderPicker(list);
  if (!slug || slug !== state.workflow) return;
  if (gone) {
    // Said plainly, never acted on: the selection stays, the thread stays, and
    // an in-flight run is untouched. Swapping the workflow under someone
    // mid-conversation would be the worse failure.
    showNotice(reason === "deleted"
      ? `“${slug}” was deleted. It is still selected here but can no longer answer — please pick another workflow.`
      : `“${slug}” was unpublished and is no longer offered. It is still selected here; pick another workflow to continue.`);
    return;
  }
  if (reason === "saved") {
    // The cached document is now stale — the next turn must fetch the new one.
    state.doc = null;
    // The diagram is only redrawn between runs: repainting it mid-run would
    // wipe the live highlight of the turn in flight.
    if (!inFlight) void renderFlow(state.workflow);
    showNotice(`“${slug}” was updated — your next message will use the new version.`);
  }
}

/** The one open catalogue stream, or null. */
let catalogue = null;
function watchCatalogue() {
  if (catalogue || typeof EventSource === "undefined") return;
  let opened = false;
  const es = new EventSource("/api/events");
  catalogue = es;
  es.onopen = () => {
    // On a RE-open, refetch once: `EventSource` reconnects by itself, and
    // whatever changed while the socket was down was never sent to anyone.
    if (opened) void refreshPicker(null, null);
    opened = true;
  };
  es.addEventListener("workflows.changed", (e) => {
    let d;
    try { d = JSON.parse(e.data); } catch { return; }
    void refreshPicker(d.reason, d.slug);
  });
  es.onerror = () => {
    // While `readyState` is CONNECTING the browser is retrying on its own —
    // nothing to do, and nothing to say. CLOSED means it has given up for
    // good; fall back to the load-time picker rather than breaking the page.
    if (es.readyState === EventSource.CLOSED) catalogue = null;
  };
  // Both ends of the connection get closed. `pagehide` is the one that fires
  // reliably on mobile Safari and on bfcache navigation; `beforeunload` covers
  // the rest. Closing frees the server's subscription at once instead of
  // leaving it for a socket timeout to notice.
  const shut = () => { es.close(); catalogue = null; };
  addEventListener("pagehide", shut);
  addEventListener("beforeunload", shut);
}

/**
 * A node's own type, humanised — the fallback for a node its author never
 * named (ticket 82).
 *
 * `in1`/`out1`/`grader-general` are compiler handles, not words a reader
 * chose or can act on — they are the developer half of the same boundary
 * `docs/api.md` §"Audience: what a customer's run cannot carry" already draws
 * for `warnings`. But a bare type ("input.text", "route.grader") is still
 * real information the customer surface may show: it says what kind of step
 * ran without pretending a person named it. The editor's own trace
 * (`src/view/ask/traceTree.tsx`) is a developer surface and keeps the raw id
 * on purpose — this function is only reached on `/chat`.
 */
function humanizeType(type) {
  const str = String(type || "");
  const family = str.split(".")[0] || "";
  // The two families every workflow has, named the way a reader thinks of
  // their own turn rather than the way the compiler wires it up.
  if (family === "input") return "Your question";
  if (family === "output") return "Answer";
  const tail = str.split(".").pop() || "";
  const words = tail.replace(/[-_]+/g, " ").trim();
  if (!words) return "";
  return words.charAt(0).toUpperCase() + words.slice(1);
}

/**
 * The name a node's author gave it, for the trace.
 *
 * Frames carry the node **id** — `in1`, `router1`, `node:agent.llm-1` — which
 * is the compiler's handle on it, not a word this reader chose. The document
 * is already loaded for the run, so the title is a lookup away
 * (reviews-2026-08-14 ticket 04). Falls back to the node's own **type**,
 * humanised (ticket 82): `in1` with no title but type `input.text` reads as
 * "Text", not as the id nobody but a developer can act on. A node with
 * neither a title nor a resolvable type falls back to the bare id — the
 * floor this whole chain cannot go below.
 */
/**
 * The canvas node a frame belongs to (ticket 72).
 *
 * `path` is the server's own walk of the checkpoint namespace against a known
 * name->id map (`RunPathResolver`), and it runs **outermost first**: an
 * agent's inner `model` step arrives with `namespace: ["agent_sql:<uuid>"]`
 * and therefore `path: ["agent-sql"]`, while a step inside a mounted workflow
 * arrives as `["wf-music", "agent-sql"]`.
 *
 * The **first** entry is the one this page wants. It shows one document, the
 * one it is chatting with, and `path[0]` is always a node on it — the deeper
 * entries are nodes of a document the customer never sees, and `displayName`
 * would resolve their ids against the wrong `nodes` list and print a
 * confident, wrong title. Outermost-first, a whole mounted run collapses to
 * the mount's own line, which is what a mount is.
 *
 * `activeNode` is the server's own top-level answer and says the same thing;
 * it is only the fallback because it is *sticky* across frames that resolve
 * to nothing.
 *
 * Returns "" when the frame cannot say, and the caller keeps the old
 * positional rule for that case.
 */
function frameOwner(d) {
  const path = d && d.path;
  if (path && path.length) return path[0] || "";
  return (d && d.activeNode) || "";
}

function displayName(nodeId) {
  const bare = String(nodeId || "").replace(/^node:/, "");
  const nodes = (state.doc && state.doc.document && state.doc.document.nodes) || [];
  const hit = nodes.find((n) => n.id === nodeId || n.id === bare);
  if (hit && hit.title) return hit.title;
  return (hit && humanizeType(hit.type)) || bare;
}

async function docFor(slug) {
  if (!state.doc || state.doc.slug !== slug) {
    const record = await (await fetch(`/api/workflows/${slug}`)).json();
    state.doc = { slug, document: record.document };
  }
  return state.doc.document;
}

/* The name above the workflow's first bubble of a turn
 * (`stable-beta-public/10`).
 *
 * The picker's own label rather than the slug: a slug is a name the customer
 * never chose (`say-it-on-the-surface/03`), and the option they selected is
 * the words this page has already used for the workflow. Falls back to the
 * slug only when the picker cannot say — a run started before the catalogue
 * answered — because a bubble with nothing above it is unattributed, which is
 * the defect this ticket is about. */
function workflowName() {
  const sel = $("wf");
  const option = sel && sel.selectedOptions && sel.selectedOptions[0];
  const label = option ? option.textContent.trim() : "";
  return label || state.workflow || "Workflow";
}

/* Everything below the question goes inside `.reply` — the workflow's side of
 * the conversation, in one group under one name. */
function replyOf(el) {
  return el.querySelector(".reply") || el;
}

function turnEl(question) {
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="q"></div><div class="reply"><p class="who"></p><div class="steps"></div>`
    + `<details class="tl" hidden><summary>Timeline · <span class="tl-count"></span> · <span class="tl-total"></span></summary>`
    + `<div class="tl-body"></div><p class="tl-note">Durations are gaps between stream frames, not measured spans.</p></details>`
    + `<div class="reasoning"></div>`
    + `<div class="draft" hidden><p class="draft-notice" role="status"></p>`
    + `<div class="draft-text"></div></div>`
    + `<div class="thinking"></div>`
    + `<div class="rejected-banner" hidden><span class="dot"></span>`
    + `<span>The answer below is one our reviewer rejected — we ran out of attempts to improve it.</span></div>`
    + `<div class="answer rich-text--narrow" hidden></div></div>`;
  el.querySelector(".q").textContent = question;
  el.querySelector(".who").textContent = workflowName();
  const empty = $("empty");
  if (empty) empty.remove();
  $("log").appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

async function stream(path, body, el, signal) {
  const steps = el.querySelector(".steps"), thinking = el.querySelector(".thinking"), answer = el.querySelector(".answer");
  const draftBox = el.querySelector(".draft"), draftText = el.querySelector(".draft-text");
  /* One sentence, on both surfaces, and neither owns it: the editor's copy is
     `src/view/ask/draftNotice.ts` and `draftNotice.parity.test.ts` fails if the
     two ever disagree. See that module for why these six words and no actor.
     Written once, when the box first appears, so a screen reader announces the

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenStateGraph Chat</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #split { flex: 1; display: flex; min-height: 0; }
  #flowpane { flex: 1; overflow: auto; padding: 16px; min-width: 0; }
  #flowpane h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #chatcol { width: 420px; max-width: 420px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); min-height: 0; }
  @media (max-width: 900px) { #split { flex-direction: column; } #chatcol { width: 100%; max-width: none; border-left: none; border-top: 1px solid var(--line); } #flowpane { max-height: 45vh; } }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header strong { margin-right: auto; }
  select, input, button, textarea { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  button { cursor: pointer; }
  main { flex: 1; overflow-y: auto; padding: 14px; min-height: 0; }
  #flow svg { width: 100%; height: auto; }
  #flow .flow-active > * { stroke: #22c55e !important; stroke-width: 2.5px !important; }
  #flow .flow-active rect, #flow .flow-active polygon { fill: #22c55e33 !important; }
  .turn { margin-bottom: 20px; }
  .q { font-weight: 600; margin-bottom: 6px; }
  .steps { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 6px 0; }
  .steps div.child { margin-left: 14px; opacity: .75; }
  .thinking { font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .answer { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 8px; overflow-x: auto; }
  .answer table { border-collapse: collapse; } .answer td, .answer th { border: 1px solid var(--line); padding: 3px 8px; }
  .answer code, .answer pre { background: #8881; border-radius: 4px; padding: 1px 4px; }
  .error { color: #e5484d; }
  .hitl { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  footer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  footer textarea { flex: 1; resize: none; height: 44px; }
</style>
</head>
<body>
<header>
  <strong>OpenStateGraph</strong>
  <select id="wf" title="Workflow"></select>
  <button id="newconv" title="Start a fresh thread">New conversation</button>
  <input id="email" type="email" placeholder="you@example.com" title="Used to remember you across sessions" style="width:180px">
  <span id="who" style="font-size:12px;color:var(--muted)"></span>
</header>
<div id="split">
  <section id="flowpane">
    <h2>Live flow</h2>
    <div id="flow">select a workflow…</div>
  </section>
  <div id="chatcol">
    <main id="log"></main>
    <footer>
      <textarea id="msg" placeholder="Ask the selected workflow…"></textarea>
      <button id="send">Send</button>
    </footer>
  </div>
</div>
<script src="/chat/mermaid.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = {
  email: localStorage.getItem("openstategraph.email") || "",
  sessionId: sessionStorage.getItem("openstategraph.session") || crypto.randomUUID(),
  threads: JSON.parse(localStorage.getItem("openstategraph.threads") || "{}"),
  workflow: null, doc: null, pending: null,
};
sessionStorage.setItem("openstategraph.session", state.sessionId);
$("email").value = state.email;
$("email").onchange = () => {
  state.email = $("email").value.trim() || "anonymous";
  localStorage.setItem("openstategraph.email", state.email);
  $("who").textContent = state.sessionId.slice(0, 8);
};
$("who").textContent = state.sessionId.slice(0, 8);

function threadFor(slug) {
  if (!state.threads[slug]) {
    state.threads[slug] = crypto.randomUUID();
    localStorage.setItem("openstategraph.threads", JSON.stringify(state.threads));
  }
  return state.threads[slug];
}
$("newconv").onclick = () => {
  delete state.threads[state.workflow];
  localStorage.setItem("openstategraph.threads", JSON.stringify(state.threads));
  $("log").innerHTML = "";
};

// Minimal markdown: headings, bold, code fences, inline code, tables, lists.
// Deliberately no raw HTML passthrough — everything is escaped first.
function md(text) {
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  const lines = esc(text).split("\n");
  let out = [], inCode = false, inTable = false, inList = false;
  const closeAll = () => { if (inTable) { out.push("</table>"); inTable = false; } if (inList) { out.push("</ul>"); inList = false; } };
  for (const line of lines) {
    if (line.startsWith("```")) { closeAll(); out.push(inCode ? "</pre>" : "<pre>"); inCode = !inCode; continue; }
    if (inCode) { out.push(line); continue; }
    let l = line.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    if (/^\s*\|.*\|\s*$/.test(l)) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      if (!inTable) { closeAll(); out.push("<table>"); inTable = true; }
      out.push("<tr>" + l.trim().slice(1, -1).split("|").map((c) => "<td>" + c.trim() + "</td>").join("") + "</tr>");
      continue;
    }
    if (/^\s*[-*] /.test(l)) { if (!inList) { closeAll(); out.push("<ul>"); inList = true; } out.push("<li>" + l.replace(/^\s*[-*] /, "") + "</li>"); continue; }
    closeAll();
    const h = l.match(/^(#{1,4}) (.*)$/);
    if (h) { out.push(`<h${h[1].length + 2}>${h[2]}</h${h[1].length + 2}>`); continue; }
    if (l.trim()) out.push("<p>" + l + "</p>");
  }
  closeAll();
  if (inCode) out.push("</pre>");
  return out.join("\n");
}

// --- Live flow view (ticket 68, as the user actually meant it): the
// active workflow's compiled graph, with the node currently processing lit
// up as stream frames arrive. Same safe_name rule as the compiler.
const flow = { slug: null, ready: false };
const safeName = (id) => id.replace(/[^a-zA-Z0-9_]/g, "_");

async function renderFlow(slug) {
  const host = $("flow");
  if (flow.slug === slug && flow.ready) return;
  flow.slug = slug; flow.ready = false;
  host.textContent = "compiling…";
  try {
    const resp = await fetch(`/api/workflows/${slug}/graph`);
    if (!resp.ok) { host.textContent = "no compiled view: " + resp.status; return; }
    const { mermaid: text } = await resp.json();
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral" });
    const { svg } = await mermaid.render("flow-" + Date.now(), text);
    host.innerHTML = svg;
    flow.ready = true;
  } catch (err) {
    host.textContent = "flow view unavailable: " + err;
  }
}

let activeFlowNode = null;
function highlightFlow(nodeId) {
  if (!flow.ready || !nodeId) return;
  const name = safeName(nodeId);
  if (activeFlowNode) activeFlowNode.classList.remove("flow-active");
  // Mermaid stamps flowchart node ids as `flowchart-<name>-N`.
  const el = $("flow").querySelector(`[id*="-${CSS.escape(name)}-"]`);
  if (el) { el.classList.add("flow-active"); activeFlowNode = el; }
}

async function loadWorkflows() {
  const list = await (await fetch("/api/workflows")).json();
  // "Auto" is the hidden concierge gateway (ticket 67): a predefined
  // router-of-workflows the customer never has to know about.
  $("wf").innerHTML = '<option value="concierge">Auto — let OpenStateGraph route</option>'
    + list.map((w) => `<option value="${w.slug}">${w.name}</option>`).join("");
  state.workflow = "concierge";
  $("wf").onchange = async () => {
    state.workflow = $("wf").value; state.doc = null;
    void renderFlow(state.workflow);
  };
  void renderFlow(state.workflow);
}

async function docFor(slug) {
  if (!state.doc || state.doc.slug !== slug) {
    const record = await (await fetch(`/api/workflows/${slug}`)).json();
    state.doc = { slug, document: record.document };
  }
  return state.doc.document;
}

function turnEl(question) {
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="q"></div><div class="steps"></div><div class="thinking"></div><div class="answer" hidden></div>`;
  el.querySelector(".q").textContent = question;
  $("log").appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

async function stream(path, body, el) {
  const steps = el.querySelector(".steps"), thinking = el.querySelector(".thinking"), answer = el.querySelector(".answer");
  const resp = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!resp.ok) { answer.hidden = false; answer.innerHTML = `<span class="error">Runtime error (${resp.status}): ${esc(await resp.text())}</span>`; return; }
  const reader = resp.body.getReader(); const dec = new TextDecoder();
  let buf = "", event = null, tokens = "";
  const esc2 = (s) => s.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) {
          const d = JSON.parse(line.slice(6));
          if (event === "update") {
            if (!d.internal) highlightFlow(d.node);
            if (d.internal) {
              // Internal machinery collapses to a live counter on its owning
              // step — a 20-call tool loop is one line, not twenty.
              const last = steps.lastElementChild;
              if (last) {
                const n = (Number(last.dataset.internal) || 0) + 1;
                last.dataset.internal = String(n);
                last.textContent = last.dataset.base + "  ·  " + n + " steps";
              }
            } else {
              const row = document.createElement("div");
              const base = "▸ " + d.node + (d.taskId ? " (" + d.taskId + ")" : "");
              row.dataset.base = base;
              row.textContent = base;
              steps.appendChild(row);
            }
            el.scrollIntoView({ block: "end" });
          } else if (event === "token") {
            tokens += d.content; thinking.textContent = tokens.slice(-600);
          } else if (event === "error") {
            answer.hidden = false; answer.innerHTML = `<span class="error">${esc2(d.detail || JSON.stringify(d))}</span>`;
          } else if (event === "interrupt") {
            renderInterrupt(el, d);
          } else if (event === "done") {
            thinking.textContent = "";
            answer.hidden = false;
            answer.innerHTML = md(d.answer || "_no answer_");
            if (d.warnings && d.warnings.length) answer.innerHTML += `<p class="error">${esc2(d.warnings.join("; "))}</p>`;
            offerSave(el, d.answer || "");
          }
        }
      }
    }
  }
  el.scrollIntoView({ block: "end" });
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// The Architect's ephemeral-first contract (ticket 69): composing returns a
// document; SAVING is a human act. When an answer carries a workflow JSON
// fence, this renders that act — one click, one PUT to the existing store
// endpoint, and the new workflow joins the picker.
function offerSave(el, answerText) {
  const m = answerText.match(/```json\s*([\s\S]*?)```/);
  if (!m) return;
  let doc;
  try { doc = JSON.parse(m[1]); } catch { return; }
  doc = doc.document || doc;
  if (!Array.isArray(doc.nodes) || !Array.isArray(doc.edges)) return;
  const box = document.createElement("div");
  box.className = "hitl";
  box.innerHTML = `<b>This answer contains a workflow.</b>
    <input id="save-slug" placeholder="slug e.g. my-research-team" style="width:220px">
    <button>Save as workflow</button> <span class="saved"></span>`;
  el.appendChild(box);
  box.querySelector("button").onclick = async () => {
    const slug = box.querySelector("#save-slug").value.trim();
    const note = box.querySelector(".saved");
    if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) { note.textContent = "slug: lowercase letters, digits, hyphens"; return; }
    const resp = await fetch(`/api/workflows/${slug}`, {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: doc.name || slug, document: doc }),
    });
    if (resp.ok) {
      note.textContent = "saved ✔ — now in the workflow picker";
      loadWorkflows();
    } else {
      note.textContent = "save failed: " + esc(await resp.text()).slice(0, 120);
    }
  };
}

function renderInterrupt(el, d) {
  const box = document.createElement("div");
  box.className = "hitl";
  box.innerHTML = `<p><b>Approval needed:</b> ${esc(d.message || "")}</p><div class="answer">${md(d.candidate || "")}</div>
    <button data-d="approve">Approve</button> <button data-d="reject">Reject</button>`;
  el.appendChild(box);
  for (const b of box.querySelectorAll("button")) {
    b.onclick = async () => {
      box.remove();
      const doc = await docFor(state.workflow);
      await stream("/api/runs/resume", {
        thread_id: d.thread_id, workflow: { document: doc }, decision: b.dataset.d,
        workflow_slug: state.workflow, session_id: state.sessionId, user_email: state.email || "anonymous",
      }, el);
    };
  }
}

$("send").onclick = send;
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
async function send() {
  const q = $("msg").value.trim();
  if (!q || !state.workflow) return;
  $("msg").value = "";
  const el = turnEl(q);
  try {
    const doc = await docFor(state.workflow);
    await stream("/api/runs/stream", {
      workflow: { document: doc }, question: q, workflow_slug: state.workflow,
      thread_id: threadFor(state.workflow), session_id: state.sessionId, user_email: state.email || "anonymous",
    }, el);
  } catch (err) {
    const a = el.querySelector(".answer"); a.hidden = false;
    a.innerHTML = `<span class="error">${esc(String(err))}</span>`;
  }
}
loadWorkflows();
</script>
</body>
</html>

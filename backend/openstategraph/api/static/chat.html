     state once rather than once per token. */
  el.querySelector(".draft-notice").textContent = "Draft — not checked yet";
  const rejectedBanner = el.querySelector(".rejected-banner");
  const reasoning = el.querySelector(".reasoning");
  /* What a step says about itself while it is still working (`progress`).
   *
   * `launch-readiness/140` turned this from one replaced-in-place line into a
   * stack, for the reason the ticket gives: one line replaced ten times shows
   * a reader the tenth thing and no account of the other nine. It is still
   * never a step row — a step row records that something finished — but it is
   * no longer thrown away when the step ends. `settleThinking` stops the
   * pulse and leaves the account, so "page 3 of 12" can no longer read as
   * *still* paging while nothing is happening, and the record of it survives.
   *
   * The three rules are the editor's `pushNarration`, deliberately the same:
   * a blank frame is dropped, a line repeated back to back collapses (a tool
   * loop emits "Thinking about the next step." every lap, and a panel reading
   * *Thinking… Thinking… Thinking…* looks like progress and carries none), and
   * the stack is capped so a runaway loop cannot grow the DOM without limit. */
  const THINKING_LIMIT = 200;
  const liveLine = (text) => {
    const line = (text || "").trim();
    if (!line) return;
    let box = steps.querySelector(":scope > div.thinking.live");
    if (!box) {
      box = document.createElement("div");
      box.className = "thinking live";
      steps.appendChild(box);
    } else {
      steps.appendChild(box); // the live stack always sits last
    }
    const last = box.lastElementChild;
    if (last && last.textContent === line) return;
    const row = document.createElement("p");
    row.textContent = line;
    box.appendChild(row);
    while (box.children.length > THINKING_LIMIT) box.removeChild(box.firstElementChild);
    // Only while it is the live stack, and only if the reader has not scrolled
    // back through it — being yanked to the bottom mid-read is the reason a
    // scrolling panel is worth having at all.
    if (box.scrollHeight - box.scrollTop - box.clientHeight < 24) box.scrollTop = box.scrollHeight;
  };
  const settleThinking = () => {
    for (const box of steps.querySelectorAll(":scope > div.thinking.live")) {
      box.classList.remove("live");
    }
  };

  /* The wait, named — `launch-readiness/141`.
   *
   * Two sentences and no more, because only one thing is honestly known: has
   * anything come back at all. An `update` frame fires when a node COMPLETES
   * and carries that same node as its `activeNode`, so after a step lands the
   * identity of whatever is now in charge is genuinely unknown until it
   * narrates itself. A line naming a step would be an invention.
   *
   * Removed by the first frame that carries a voice of its own, and by every
   * ending — a placeholder that outlives the thing it stood in for is
   * `launch-readiness/110` wearing the other hat. */
  const WAITING_TO_START = "Sent your question — waiting for the workflow to start.";
  const WAITING_FOR_THE_NEXT_STEP = "Working — waiting for the next step to say what it is doing.";
  const showWaiting = (text) => {
    let row = steps.querySelector(":scope > p.waiting");
    if (!row) { row = document.createElement("p"); row.className = "waiting"; row.setAttribute("role", "status"); row.setAttribute("aria-live", "polite"); }
    if (row.textContent !== text) row.textContent = text;
    steps.appendChild(row); // always last: it is the present tense
  };
  const clearWaiting = () => {
    const row = steps.querySelector(":scope > p.waiting");
    if (row) row.remove();
  };
  showWaiting(WAITING_TO_START);
  const resp = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal });
  if (!resp.ok) {
    finishFlow();
    clearWaiting();
    // A door refused before any stream started — no provider installed, a
    // bad slug, a malformed request. FastAPI's own error shape is
    // `{"detail": "..."}`, and `detail` is written in the product's own
    // voice (`NoProviderInstalled`'s `pip install 'openstategraph[...]'`
    // sentence, `RunContextError`'s named key) — the same sentence
    // `openstategraph serve` and `openstategraph providers` already print.
    // Showing it verbatim, with no "Runtime error (503):" wrapper, is what
    // launch-readiness 16 and providers-and-credentials 15 asked for: a
    // reader here should see the sentence, not the transport it arrived on.
    // A body that is not that shape (a proxy's HTML error page, a bare
    // "Internal Server Error") falls back to the raw text, unchanged from
    // before.
    const raw = await resp.text();
    let message = raw;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.detail === "string") message = parsed.detail;
    } catch { /* not JSON — the raw body is the best available message */ }
    answer.hidden = false; answer.innerHTML = `<span class="error">${esc(message)}</span>`;
    return "http-error";
  }
  const reader = resp.body.getReader(); const dec = new TextDecoder();
  let buf = "", event = null, tokens = "", thoughts = "", drafted = "";
  // Client-side timestamps, gathered as frames arrive — the stream carries no
  // timing of its own. Ephemeral: this list lives with the turn and is never
  // stored anywhere.
  const tlRows = []; let lastFrameAt = performance.now();
  // Child names harvested from `spawn` events, keyed by whichever handle the
  // child's own frames carry (`taskId` for a Send-dispatched worker, the
  // namespace head for a mounted subgraph).
  const tlNames = {};
  // `spawnId` -> the row that announced that child, so the `settled` frame
  // that closes it can finish the line it already wrote.
  const spawnRows = {};
  /* Did this stream say how it ended? The server's contract is that every
   * stream it can still write to ends with `done`, `interrupt` or `error`
   * (see `_stream_run`). The one case it cannot cover is its own death — a
   * `--reload` restart or a crash closes the socket with nothing on it — so
   * this flag is what turns that silence into an honest line instead of a
   * turn that just stops. */
  let ended = null;
  const esc2 = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Whether Stop, right now, CANCELS the step in charge or merely walks away
  // from it (`async-first/07`). The server says so per node on every frame
  // that names an active one, because it is a property of the node and not of
  // the run — an agent can be cancellable while the grader after it is not.
  // `false` until told otherwise, which is also what an older backend earns.
  let cancellable = false;
  try {
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) {
          const d = JSON.parse(line.slice(6));
          if (d && typeof d.interruptible === "boolean") cancellable = d.interruptible;
          if (event === "started") {
            // The run has begun, and it names the thread it is in
            // (`memory-and-replay` 53). This page mints its own thread id and
            // sends it, so most of the time this is an echo — but not always:
            // a resume sends whatever the `interrupt` frame named, and a
            // request that omits the id gets one the *server* invents. Before
            // this frame the only place that id was ever disclosed was a
            // terminal frame, so a run that dropped halfway took the
            // conversation with it. The server is authoritative; take its
            // answer at the start rather than hoping to reach the end.
            if (d.threadId && state.workflow) {
              state.threads[state.workflow] = d.threadId;
              localStorage.setItem("openstategraph.threads", JSON.stringify(state.threads));
            }
          } else if (event === "update") {
            const now = performance.now();
            tlRows.push({ node: d.node, taskId: d.taskId ?? null, internal: !!d.internal, namespace: d.namespace || [], owner: frameOwner(d), ms: now - lastFrameAt });
            lastFrameAt = now;
            renderTimeline(el, tlRows, tlNames);
            // What lights up is `flowFrameName(d)` — the deepest node on this
            // frame's `path` that the diagram actually draws. An agent's
            // internal `model`/`tools` frames name no canvas node at all and
            // used to leave the marker on whatever ran last at the top level,
            // i.e. the router (ticket 01, which fixed that with `activeNode`).
            // A frame from inside a *mounted* workflow does the same thing for
            // a different reason, and `activeNode` cannot fix it: since the
            // diagram opened its mounts there is no box with the mount's name
            // to light. Internal frames move the marker but never add a step
            // row.
            highlightFlow(flowFrameName(d));
            const owner = frameOwner(d);
            // The row a node's steps hang on, opened by whichever of its
            // frames arrives first. `[data-open]` marks a row whose node has
            // not reported finishing yet; at most one visit of a node can be
            // open at a time, because its own frame closes it.
            const openRow = (id) => id
              ? steps.querySelector(':scope > div[data-open="1"][data-owner="' + CSS.escape(id) + '"]')
              : null;
            if (d.internal) {
              // Internal machinery collapses to a live counter on its owning
              // step — a 20-call tool loop is one line, not twenty.
              //
              // Its owner is the node the SERVER resolved for the frame, not
              // the row above it (ticket 72). An agent's inner frames arrive
              // before the agent's own `update`, so "the last real step" was
              // always the node that ran *before* the work: on
              // `chinook-assistant` a tool-less classifier was shown making
              // the database calls, and the SQL agent that owns those tools
              // showed nothing at all.
              let last = openRow(owner);
              if (!last && owner) {
                settleThinking();
                last = document.createElement("div");
                last.dataset.base = "▸ " + displayName(owner);
                last.dataset.owner = owner;
                last.dataset.open = "1";
                last.textContent = last.dataset.base;
                steps.appendChild(last);
              }
              if (!last) {
                // A frame that cannot say who it belongs to — an older
                // backend. The positional rule is kept for it: still better
                // than dropping the step.
                last = steps.lastElementChild;
                while (last && (last.classList.contains("spawn") || last.classList.contains("live"))) {
                  last = last.previousElementSibling;
                }
              }
              if (last) {
                const n = (Number(last.dataset.internal) || 0) + 1;
                last.dataset.internal = String(n);
                last.textContent = last.dataset.base + "  ·  " + n + " steps";
              }
            } else {
              // A step completed, so whatever it was last saying about
              // itself is no longer the present tense. The account of it
              // stays — it stops pulsing and the row recording the finish
              // goes below it (`launch-readiness/140`).
              settleThinking();
              const existing = openRow(owner);
              const row = existing || document.createElement("div");
              const base = "▸ " + displayName(owner || d.node) + (d.taskId ? " (" + d.taskId + ")" : "");
              row.dataset.base = base;
              row.dataset.owner = owner || d.node;
              row.textContent = base + (Number(row.dataset.internal)
                ? "  ·  " + row.dataset.internal + " steps" : "");
              delete row.dataset.open;
              if (!existing) steps.appendChild(row);
            }
            // A step finished; nothing has said what the next one is doing.
            // The wait changes, and it is still a wait — but only while this
            // turn has never had a voice. Once a step has narrated itself the
            // stack is on screen and stays there, and re-showing the
            // placeholder in the gap between two narration lines made it
            // flash on for a millisecond and off again (measured live, three
            // times between 7.9 s and 12.3 s of one run). A placeholder that
            // blinks is worse than the gap it fills, so this is the OPENING
            // silence only.
            //
            // Last in this branch, not first: `showWaiting` appends, and the
            // step row this frame is about has only just been added. Called
            // at the top, the wait sat ABOVE the step it was waiting after.
            if (!steps.querySelector(":scope > div.thinking")) showWaiting(WAITING_FOR_THE_NEXT_STEP);
            el.scrollIntoView({ block: "end" });
          } else if (event === "progress") {
            clearWaiting(); // a real line takes over
            // The frame this page was the reason for, and the one it used to
            // drop (architecture review 2026-08-16, F2). `update` fires when a
            // node COMPLETES and `token` exists only while a model types, so a
            // tool spending forty seconds paging an API produced neither — and
            // `streaming.py` says who that silence was worst for: "the audience
            // that cannot open a trace to explain it." That audience is here.
            //
            // Not a step row and not a timeline bar: a progress frame is a
            // step talking about itself mid-work, so it is one live line that
            // the step's own `update` frame then replaces. It moves the flow
            // marker for the same reason `token` does — it is the other frame
            // that arrives while a node is still running.
            highlightFlow(flowFrameName(d));
            // `current`/`total` are `int | None` independently, so the count is
            // shown only in the shapes that are actually true: "3/12", or "3"
            // when nothing knows the total, and nothing at all when neither.
            const count = typeof d.current === "number"
              ? (typeof d.total === "number" ? ` (${d.current}/${d.total})` : ` (${d.current})`)
              : "";
            // No "⋯ " prefix any more (`launch-readiness/140`): the stack
            // draws its own mark per line, and the two together rendered as
            // a double marker — caught on a live MCP run.
            liveLine((d.message || displayName(d.node)) + count);
            el.scrollIntoView({ block: "end" });
          } else if (event === "invoked") {
            // A tool was asked for and has not answered yet
            // (`memory-and-replay` 55). It moves the flow marker for the same
            // reason `progress` above does — it is one of the frames that
            // arrive while a node is still running, and on a slow tool it is
            // the one at the front of the silence.
            //
            // No row of its own. `name` and `callId` are blank for this
            // page's audience by design (a tool's name is its own
            // disclosure), so a row here could only ever say "a tool" — which
            // is what the narration line above already says, in better words.
            // What the tool returns arrives as a `token` frame carrying the
            // same `callId`, and that is what a reader actually reads.
            highlightFlow(flowFrameName(d));
          } else if (event === "spawn") {
            // The moment the run created a child worker or subagent. A row of
            // its own, never a tick on the previous step's internal counter:
            // "3 more internal steps" is exactly what hides a fan-out.
            const row = document.createElement("div");
            const base = "⤷ spawned " + displayName(d.label) + (d.instruction ? " — " + d.instruction : "");
            row.className = "spawn";
            row.dataset.base = base;
            row.textContent = base;
            row.title = d.instruction || "";
            steps.appendChild(row);
            // Named lanes in the timeline too, so a bar reads `researcher`
            // rather than a bare task id or a checkpoint namespace.
            if (d.taskId) tlNames["task:" + d.taskId] = d.label;
            if (d.namespace && d.namespace[0]) tlNames["ns:" + d.namespace[0]] = d.label;
            if (d.spawnId) spawnRows[d.spawnId] = row;
            el.scrollIntoView({ block: "end" });
          } else if (event === "settled") {
            // The other end of the child (`memory-and-replay` 54). It finishes
            // the row the spawn wrote rather than adding one: a child that
            // started and the same child stopping are one thing to read.
            //
            // Joined on `spawnId` alone. A fan-out dispatches several children
            // under one label, and a mounted workflow carries no `taskId` at
            // all, so either would finish a row belonging to somebody else.
            const row = spawnRows[d.spawnId];
            // `ok` says nothing a reader needs — the row is already there and
            // the run is already moving on. The other three are the ones that
            // change what the row means, and `detached` is the one this page
            // exists to say: a background worker outlives this answer.
            const note = d.outcome === "error" ? "never ran"
              : d.outcome === "detached" ? "still running"
              : d.outcome === "unknown" ? "no ending recorded"
              : "";
            if (row && note) {
              row.textContent = row.dataset.base + " · " + note;
            }
          } else if (event === "token") {
            clearWaiting(); // the answer is typing itself out
            // A token frame moves the marker too (ticket 02) — and it is the
            // only frame that can move it *early*. `update` frames are emitted
            // when a node finishes, so a diagram driven by updates alone shows
            // the last node to COMPLETE: on a real run the mounted analyst
            // streamed 100+ tokens over ~20s while the ring still sat on the
            // router, which is the bug as it was reported.
            //
            // Not throttled here, and it does not need to be: `highlightFlow`
            // returns immediately when the node is already the active one
            // (`activeFlowName === name`), so a whole model turn costs one DOM
            // change. That guard exists precisely because this path is hot.
            // No step row and no timeline bar — a token is not a step.
            //
            // Through `flowFrameName`, never `d.node`: a token frame's own
            // node is usually an inner step (`model`, `tools`) that this
            // diagram has no box for, and `highlightFlow` answers an unmatched
            // name by clearing the ring entirely. The comment above dates from
            // when this line read `d.activeNode` and the bug it describes —
            // 100+ tokens streaming out of the mounted analyst with the ring
            // still on the router — is the one that change did NOT fix, for
            // the reason `flowFrameName` records.
            highlightFlow(flowFrameName(d));
            // `block` says WHAT KIND of text this is — `reasoning` for a
            // thinking model's deliberation, `text` for the reply it is
            // deliberating towards. Two buffers, because one buffer is the bug
            // `7cd90c6` fixed for the editor and left live here: concatenating
            // them renders a model's private working-out as if it were the
            // answer, in the one place a customer reads.
            //
            // The branch is not dead code on a page that runs `audience:
            // "customer"`, where `streaming.py` drops reasoning frames rather
            // than emptying them. `audience` is a request field — one line of
            // this file away — and a client whose correctness depends on the
            // server never sending a frame it publishes is not a client of the
            // contract, it is a client of today's default.
            //
            // Missing `block` reads as `text`: that is what an older backend
            // emitted, and it is what every non-reasoning frame is.
            //
            // `draft` says WHETHER A GRADER HAS STILL TO JUDGE IT
            // (`every-workflow-green` 45) — a third buffer, for the same
            // reason `block` bought the second. The run that produced that
            // ticket streamed three attempts and then a settled output node;
            // concatenating them puts a figure the grader is about to reject
            // and the one it settled on into a single block, and no mark on
            // that block can be right about both.
            //
            // Absent means NO GRADER IS DOWNSTREAM, never "checked", so an
            // ungraded workflow renders exactly as it did before this existed
            // — no box, no label, nothing that appears and vanishes.
            if (d.block === "reasoning") { thoughts += d.content; reasoning.textContent = thoughts.slice(-400); }
            else if (d.draft) { drafted += d.content; draftText.textContent = drafted.slice(-600); draftBox.hidden = false; }
            else { tokens += d.content; thinking.textContent = tokens.slice(-600); }
          } else if (event === "error") {
            clearWaiting();
            // Terminal. The run is over, so the diagram stops claiming to be
            // running — the same omission the `interrupt` branch had.
            ended = "error";
            finishFlow();
            thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
            answer.hidden = false; answer.innerHTML = `<span class="error">${esc2(d.detail || JSON.stringify(d))}</span>`;
          } else if (event === "interrupt") {
            clearWaiting();
            // Terminal too: this stream really is finished, and the run
            // continues only if the customer presses Approve or Reject. So
            // the diagram must stop saying "running" here — see `pauseFlow`.
            ended = "interrupt";
            pauseFlow(flowFrameName(d));
            thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
            renderInterrupt(el, d);
          } else if (event === "done") {

            ended = "done";
            finishFlow();
            thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
            // `launch-readiness` 25 — visible on this customer surface even
            // though the frame carries no `developer` channel: the fact that
            // a rejected candidate was published must not require asking for
            // `audience: "developer"`, only the grader's *reason* does.
            rejectedBanner.hidden = !d.publishedRejected;
            answer.hidden = false;
            answer.innerHTML = md(d.answer || "_no answer_");
            // No warnings rendered here any more, and the frame no longer
            // carries any. `warnings` is authoring diagnostics — unbound tool
            // types, unresolved functions, mount overrides, all naming node
            // ids — and this page used to print them to the customer in red.
            // They now ride the `developer` channel, which a run only gets by
            // declaring `audience: "developer"`; this page never does. See
            // `backend/openstategraph/api/audience.py` and `docs/api.md`.
            offerSave(el, d.answer || "");
          }
        }
      }
    }
  }
  } catch (err) {
    if (err && err.name === "AbortError") {
      // Stop, pressed. Cancelling the reader is what closes the connection,
      // and closing it is what makes the server's stream generator exit —
      // between supersteps, so the step already in flight finishes in the
      // provider and is discarded. The note says exactly that rather than
      // implying the whole run vanished mid-thought.
      await reader.cancel().catch(() => {});
      finishFlow();
      clearWaiting();
      thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
      noteStopped(el, cancellable);
      return "stopped";
    }
    // A server killed mid-stream usually arrives here rather than as a clean
    // end-of-body: the socket dies and `read()` rejects with a network error.
    // Same fact as the no-terminal-frame case below, so it gets the same
    // honest line — with the raw error appended, so a genuine bug in the
    // frame handling above is still visible rather than dressed up as a
    // network failure.
    finishFlow();
    clearWaiting();
    thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
    noteDropped(el, String((err && err.message) || err));
    return "dropped";
  }
  // A stop does not always arrive as a thrown AbortError: cancelling a reader
  // can instead resolve the pending read with `done: true`, so the loop above
  // exits cleanly having received no `done` frame. Found live — the button
  // went back to Send and the turn showed nothing at all. The signal is the
  // only thing that separates "the user stopped it" from "the server hung up".
  if (signal && signal.aborted) {
    finishFlow();
    clearWaiting();
    thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
    noteStopped(el, cancellable);
    return "stopped";
  }
  // The body ended, nobody pressed Stop, and no frame said how it ended. By
  // the server's own contract that can only mean the server never got to send
  // one: killed, reloaded, or the connection cut. **This is the authoritative
  // report of that case** — there is no frame for it and there cannot be — so
  // it is said plainly rather than left as a turn that silently stops with a
  // half-drawn diagram still glowing.
  if (!ended) {
    finishFlow();
    clearWaiting();
    thinking.textContent = ""; reasoning.textContent = ""; drafted = ""; draftText.textContent = ""; draftBox.hidden = true; settleThinking();
    noteDropped(el);
    return "dropped";
  }
  el.scrollIntoView({ block: "end" });
  return ended;
}

/* The connection died mid-answer. An error, not a note: unlike a stop, this
 * is not something the customer asked for, and the run's fate is genuinely
 * unknown from here — it may have finished on a server that is no longer
 * listening. Says what to do next, because "ask again" is the whole remedy. */
function noteDropped(el, detail) {
  const note = document.createElement("p");
  note.className = "error";
  note.textContent =
    "The connection to the runtime ended without saying how the run finished — the server most likely restarted or crashed. Nothing was saved from this turn; ask again."
    + (detail ? ` (${detail})` : "");
  replyOf(el).appendChild(note);
  el.scrollIntoView({ block: "end" });
}

/* The muted "stopped by you" line — a note, never an error.
 *
 * One wording, unlike the editor's two: this composer is a Stop only while a
 * stream is genuinely open, so a run paused at an approval can never be
 * "stopped" here — that stream has already ended, the button says Send again,
 * and the checkpointed thread is resumed by the Approve/Reject buttons. The
 * approval-pause case therefore needs no line of its own on this page. */
/* Two sentences, because there are two outcomes and they used to share one
 * (`async-first/07`). Nothing on the clock separates them — the stop is
 * instant either way — so a page that only measured the wait would print the
 * same line for a run that stopped and a run still being paid for. Measured
 * live 2026-08-27 on a three-worker fan-out disconnected 12 s in: 0.41-1.08 s
 * of work billed after a cancelled stop, 12.65-24.16 s after an abandoned
 * one. The cancelled line stops short of "nothing is running" on purpose: a
 * cancelled body unwinds at its next await, so the provider call already sent
 * is still finished. Kept in step with the editor's `view/ask/stoppedLine.ts`
 * by `tests/test_a_stop_says_what_it_stopped.py`. */
function noteStopped(el, cancellable) {
  const note = document.createElement("p");
  note.className = "stopped";
  note.textContent = cancellable
    ? "Stopped by you — the step that was running was cancelled, and nothing further is scheduled. The model call it had already sent still finishes; its result is discarded."
    : "Stopped by you — nothing further is scheduled. Steps already dispatched cannot be interrupted: they finish in the background and their results are discarded.";
  replyOf(el).appendChild(note);
  el.scrollIntoView({ block: "end" });
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// The Architect's ephemeral-first contract (ticket 69): composing returns a
// document; SAVING is a human act. When an answer carries a workflow JSON
// fence, this renders that act — one click, one PUT to the existing store
// endpoint, and the new workflow joins the picker.
function offerSave(el, answerText) {
  const m = answerText.match(/```json\s*([\s\S]*?)```/);
  if (!m) return;
  let doc;
  try { doc = JSON.parse(m[1]); } catch { return; }
  doc = doc.document || doc;
  if (!Array.isArray(doc.nodes) || !Array.isArray(doc.edges)) return;
  const box = document.createElement("div");
  box.className = "hitl";
  box.innerHTML = `<b>This answer contains a workflow.</b>
    <input id="save-slug" placeholder="slug e.g. my-research-team" style="width:220px">
    <button>Save as workflow</button> <span class="saved"></span>`;
  replyOf(el).appendChild(box);
  box.querySelector("button").onclick = async () => {
    const slug = box.querySelector("#save-slug").value.trim();
    const note = box.querySelector(".saved");
    if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) { note.textContent = "slug: lowercase letters, digits, hyphens"; return; }
    const resp = await fetch(`/api/workflows/${slug}`, {
      method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: doc.name || slug, document: doc }),
    });
    if (resp.ok) {
      note.textContent = "saved ✔ — now in the workflow picker";
      // `refreshPicker`, not `loadWorkflows`: a reload of the picker used to
      // reset the selection to Auto, which threw away the workflow this very
      // conversation was using. (The save also emits `workflows.changed`, so
      // this is belt-and-braces for a page whose stream is not up.)
      void refreshPicker("saved", slug);
    } else {
      note.textContent = "save failed: " + esc(await resp.text()).slice(0, 120);
    }
  };
}

// GENERATED-BEGIN graderVerdictLine
  // GENERATED by scripts/render_grader_verdict_line.py — do not hand-edit.
  // Source of truth: src/view/ask/graderVerdictLine.ts (`production-ready` 94).
  // The editor's approval card and this page are two doors onto one
  // judgement; this is that judgement's only spelling. Edit the TypeScript
  // and re-run the script — `backend/tests/test_one_graders_sentence.py`

  function graderVerdictLine(approval) {
    const verdict = approval.verdict.trim();
    if (!verdict) return '';
    const reason = approval.reason.trim();
    // The fourth rule, added by `production-ready` 92: a reviewer told the
    // grader asked for a revision deserves to know whether a *model* formed
    // that opinion, or whether a rule rejected the text without asking one.
    // Same fact and same wording as the trace row — `graderCheckLine` — so the
    // two doors onto one judgement cannot say different things.
    const skipped = (approval.check ?? '').trim() ? ' without a model call' : '';

    if (verdict === 'pass') {
      return reason ? `The grader passed this — ${reason}` : 'The grader passed this.';
    }
    if (verdict === 'revise') {
      return reason
        ? `The grader asked for a revision${skipped} — ${reason}`
        : `The grader asked for a revision${skipped}.`;
    }
    return reason;

  // their absence means no grader judged the candidate — so nothing is drawn
  // rather than a neutral line implying a machine looked at it. The label is

  // this was a hand-kept ternary of the same rules that had already drifted on

  // this page escapes the whole of it rather than the reason alone.
  const verdictLine = esc(
    graderVerdictLine({
      verdict: String(d.verdict || ""),

  box.innerHTML = `<p><b>Approval needed:</b> ${esc(d.message || "")}</p><div class="answer rich-text--narrow">${md(d.candidate || "")}</div>
    ${verdictLine ? `<p class="hitl__verdict">${verdictLine}</p>` : ""}
    <div class="hitl__actions">
      <button type="button" class="btn-approve" data-d="approve">Approve</button>
      <button type="button" class="btn-reject" data-d="reject">Reject</button>

      // two resumes on one checkpoint. The chosen one keeps its colour and
      // the other fades, so the card still says what was decided while the
      // resumed run streams underneath it.
      for (const other of buttons) other.disabled = true;
      b.dataset.chosen = "1";
      const doc = await docFor(state.workflow);
      // Through `runStream`, not `stream`: a resumed run streams exactly like
      // a fresh one, so it must be stoppable exactly like one.
      const outcome = await runStream("/api/runs/resume", {
        // The interrupt event spells it `threadId` (camelCase) — reading the
        // snake_case spelling posted `undefined`, JSON.stringify dropped the
        // key, and every approval died 422 "thread_id: Field required".
        thread_id: d.threadId || d.thread_id || threadFor(state.workflow),
        workflow: { document: doc }, decision: b.dataset.d,
        workflow_slug: state.workflow, session_id: state.sessionId,

    };
  }
}

/* The one open stream's abort handle, or null between runs.
 *
 * Module-scoped rather than per-turn because this page runs exactly one turn
 * at a time — the composer is the only way to start one, and it is a Stop for
 * as long as a turn is in flight. Cleared in a `finally`, so no path can
 * leave the button stuck saying Stop. */
let inFlight = null;

/** Send ⇄ Stop. One button, one place; only its meaning changes. */
function setComposerRunning(running) {
  const btn = $("send");
  btn.textContent = running ? "Stop" : "Send";
  if (running) btn.dataset.stop = "1";
  else delete btn.dataset.stop;
  updateSendEnabled();
}

/**
 * Whether Send has anything to send (ticket 82).
 *
 * `send()` already refused whitespace-only text — `q = value.trim(); if
 * (!q) return` — but silently: the button stayed enabled, so pressing it on
 * three spaces produced no turn, no error and no `POST /api/runs/stream`,
 * which is a control that looks live and reaches nothing. This is the same
 * `.trim()` the refusal already used, just surfaced on the control itself
 * instead of swallowed inside the handler. Stop is never disabled by empty
 * text — a running turn must always be stoppable regardless of what is
 * typed underneath it.
 */
function updateSendEnabled() {
  const btn = $("send");
  btn.disabled = !inFlight && !$("msg").value.trim();
}

$("send").onclick = () => { if (inFlight) inFlight.abort(); else send(); };
$("msg").addEventListener("input", updateSendEnabled);
$("msg").addEventListener("keydown", (e) => {
  // `e.key` is the modern check, but it is not the only signal a real Return
  // keypress produces: some input paths (assistive tooling, remote-control
  // automation, certain IME-adjacent key delivery) fire a keydown whose
  // `key`/`code` never get populated at all, carrying only `keyCode === 13`.
  // Reading `e.key` alone silently drops those — the text sits in the box
  // and nothing is sent, which is exactly launch-readiness/36's report.
  // Tolerant reading, still strict: accept either signal, but only for the
  // one code that means Enter.
  if ((e.key === "Enter" || e.keyCode === 13) && !e.shiftKey) {
    e.preventDefault();
    // Enter never stops a run: a stop is deliberate, and the key people hold
    // down to send should not be able to kill the turn they just started.
    if (!inFlight) send();
  }
});
updateSendEnabled();
async function send() {
  const q = $("msg").value.trim();
  if (!q || !state.workflow) return;
  $("msg").value = "";
  // A fresh run starts from a clean diagram: the client owns the request, so
  // unlike the editor it knows exactly where one run ends and the next begins.
  resetFlowHighlight();
  const el = turnEl(q);
  let doc;
  try {
    doc = await docFor(state.workflow);
  } catch (err) {
    const a = el.querySelector(".answer"); a.hidden = false;
    a.innerHTML = `<span class="error">${esc(String(err))}</span>`;
    return;
  }
  await runStream("/api/runs/stream", {
    workflow: { document: doc }, question: q, workflow_slug: state.workflow,
    thread_id: threadFor(state.workflow), session_id: state.sessionId,
  }, el);
}

/* Every stream this page opens goes through here, so every one of them is
 * stoppable and none can leave the composer or the abort handle behind. */
async function runStream(path, body, el) {
  const aborter = new AbortController();
  inFlight = aborter;
  setComposerRunning(true);
  try {
    return await stream(path, body, el, aborter.signal);
  } catch (err) {
    // Nothing below `stream` throws any more, so this is a failure to even
    // reach the runtime. The diagram is stopped regardless: no path may leave
    // it claiming to run.
    finishFlow();
    const a = el.querySelector(".answer"); a.hidden = false;
    a.innerHTML = `<span class="error">${esc(String(err))}</span>`;
    return "failed";
  } finally {
    inFlight = null;
    setComposerRunning(false);
  }
}
loadWorkflows();
// Started independently of the initial load: a backend that was briefly down
// at page load must not also cost this page its live updates.
watchCatalogue();

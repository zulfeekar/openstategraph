[pytest]
# Two roots: the shared backend package (`openstategraph.*`), and the workflow's own code.
#
# The workflow directory is a slug (`chinook-assistant`), so it cannot itself be a
# Python package name. It is put on the path so its `tools`/`functions` packages
# import directly. That is fine while one workflow exists; capability discovery
# (ticket 18) must instead load each workflow under a synthetic module name via
# `importlib.util.spec_from_file_location`, or two workflows will collide on
# `tools`. Recorded so the shortcut is not mistaken for the design.
pythonpath = backend workflows/chinook-assistant
# Collection names what it collects, and `workflows/` — the user's workspace —
# is not on the list (workflow-gallery ticket 46). The documented way to start
# a package is to copy one out of `backend/openstategraph/examples/`, and that
# copy brings the example's own `tests/test_<slug>_document.py` with it: same
# module basename, two roots, no `__init__.py`, so pytest refuses to collect
# *either* — `import file mismatch`, the collision that broke CI in `6ed56df`.
# An identical, working copy is enough to trigger it, so "copy carefully" is
# not a fix and a rename only moves it to the next copy.
#
# Nothing is lost by not sweeping: a package's `tests/` run under
# `openstategraph test <package>`, and its *document* is read by the
# every-package sweep in `backend/tests/test_the_one_example.py`, which needs
# no pytest collection of user files. The curated example is named by path,
# exactly as `pythonpath` above names it. Pinned by
# `backend/tests/test_collection_policy.py`.
testpaths = backend workflows/chinook-assistant
python_files = test_*.py
# Live-network tests (`@pytest.mark.live`) are opt-in: `pytest -m live`.
# The default gate must pass offline and on machines without CA certs.
markers = live: hits real external APIs, excluded from the default run
addopts = -m "not live"
# `data/` holds workflow fixtures (e.g. the Chinook SQLite) that must never
# be collected; `scratch/` and `output/` stay excluded as generic runtime
# jail / generated-output conventions for workflow packages.
#
# `templates` (workflow-gallery ticket 36): since each scaffold template
# under `backend/openstategraph/templates/<name>/tests/` ships its own
# `test_shape.py` — package data, not a repo test — four of them share that
# basename with no `__init__.py` between them, which is the exact
# `import file mismatch` collision the next comment already names for
# `tools`/`tests`. They are exercised for real by
# `backend/tests/test_templates.py`, which scaffolds each one into a
# `tmp_path` and runs `pytest` on the *rendered* copy — collection here would
# only ever import the template source, never a package anyone owns.
norecursedirs = .* node_modules dist build data scratch output templates
# Test directories deliberately have **no** `__init__.py`. Both `backend/tests`
# and `workflows/<slug>/tests` would otherwise be a package named `tests`, and
# with two roots on the path they collide — the same collision this file warns
# about for `tools`, which duly showed up for `tests` first. Without the marker,
# pytest imports each module by its unique basename.

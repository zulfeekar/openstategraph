# OpenStateGraph behind nginx — the same deployment as deploy/Caddyfile, for
# estates that already run nginx.
#
# COMMITTED and tested (`backend/tests/test_reverse_proxy.py` checks the paths
# and the streaming directives against the app's real routes). Caddy is the
# shorter file and obtains its own certificates; this one exists because
# "use Caddy" is not advice you can give an operations team that has nginx.
#
# What it protects and what it does not: docs/deploying.md.
#
#   1. Replace osg.example.com and the certificate paths.
#   2. Choose an authentication block below.
#   3. Run the app on loopback only: `openstategraph serve --host 127.0.0.1`.
#      A process bound to 0.0.0.0 is reachable around this file entirely.

upstream openstategraph {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name osg.example.com;

    ssl_certificate     /etc/ssl/certs/osg.example.com.pem;
    ssl_certificate_key /etc/ssl/private/osg.example.com.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # The editor is not designed to be framed, and framing it is how a
    # clickjacked "publish" button gets pressed.
    add_header X-Frame-Options DENY always;
    server_tokens off;

    # A workflow document is JSON in the tens of kilobytes.
    client_max_body_size 10m;

    # --- who is allowed in --------------------------------------------------
    #
    # Pick ONE. Uncomment for htpasswd; generate with `htpasswd -B -c
    # /etc/nginx/osg.htpasswd team`. For an organisation, use auth_request
    # against your OIDC proxy instead. If you use the app's own shared token
    # (OPENSTATEGRAPH_API_TOKEN) leave this commented — but do not leave BOTH
    # commented out.
    #
    # auth_basic "OpenStateGraph";
    # auth_basic_user_file /etc/nginx/osg.htpasswd;

    # --- the three Server-Sent Event streams --------------------------------
    #
    # Every directive here is load-bearing. Without them the streams appear to
    # work in testing and fail under the proxy:
    #
    #   proxy_buffering off        — otherwise nginx accumulates frames and the
    #                                editor's live node highlighting arrives in
    #                                one lump when the run finishes.
    #   proxy_cache off            — an event stream must never be replayed.
    #   proxy_read_timeout 24h     — a run waits on a model; a human.approval
    #                                waits on a person. The 60s default severs
    #                                a pause mid-wait.
    #   proxy_http_version 1.1 +   — HTTP/1.0 upstream, or a forwarded
    #   Connection ""                `Connection: close`, breaks chunking.
    #   gzip off                   — a compressor is a buffer.
    #   X-Accel-Buffering          — the app already sends `no` on these
    #                                responses; this is the belt to that
    #                                braces, for a deployment that rewrites it.
    location ~ ^/api/(events|runs/(stream|resume))$ {
        proxy_pass http://openstategraph;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # --- everything else ----------------------------------------------------
    #
    # The editor SPA at /, /chat, /api, /login and /openapi.json are all one
    # origin, which is what lets the editor's fetches and its EventSource carry
    # the session cookie with no CORS involved.
    location / {
        proxy_pass http://openstategraph;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run started with POST /api/runs (the unstreamed sibling) is still
        # bounded by a model, not by a page load.
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name osg.example.com;
    return 308 https://$host$request_uri;
}

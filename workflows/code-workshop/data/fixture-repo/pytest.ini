[pytest]
# Present so pytest treats this directory as its own rootdir — without it,
# a run from inside the scratch copy would walk up and adopt the OpenStateGraph
# repository's pytest.ini (and its pythonpath) as configuration.
testpaths = tests
# The project root itself, so `from stats import ...` resolves — pytest only
# auto-inserts the *test file's* directory, not the rootdir.
pythonpath = .
